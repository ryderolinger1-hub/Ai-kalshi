<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Position Ledger — Kalshi Dashboard</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: #080a0f;
  color: #f5f7fa;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

body {
  min-height: 100vh;
}

.container {
  width: min(1150px, 94%);
  margin: auto;
  padding: 28px 0 60px;
}

/* HEADER */

.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 25px;
}

.title {
  font-size: 28px;
  font-weight: 800;
}

.subtitle {
  margin-top: 5px;
  color: #858d9b;
  font-size: 13px;
}

.live-status {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #39d996;
  font-size: 12px;
  font-weight: 700;
}

.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #39d996;
  box-shadow: 0 0 10px rgba(57,217,150,.7);
}

/* ACCOUNT CARDS */

.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 25px;
}

.card {
  background: #10131a;
  border: 1px solid #202631;
  border-radius: 14px;
}

.stat-card {
  padding: 19px;
  min-height: 115px;
}

.stat-label {
  color: #808896;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .4px;
  margin-bottom: 10px;
}

.stat-value {
  font-size: 24px;
  font-weight: 800;
}

.green {
  color: #39d996 !important;
}

.red {
  color: #ff5969 !important;
}

/* PANELS */

.panel {
  background: #10131a;
  border: 1px solid #202631;
  border-radius: 15px;
  padding: 18px;
  margin-bottom: 18px;
}

.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 15px;
}

.panel-title {
  font-size: 17px;
  font-weight: 800;
}

/* PERIOD BUTTONS */

.periods {
  display: flex;
  gap: 5px;
}

.period-button {
  border: 1px solid #303642;
  background: #171b23;
  color: #89919f;
  border-radius: 8px;
  padding: 7px 13px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

.period-button.active {
  background: #e8edf3;
  color: #080a0f;
  border-color: #e8edf3;
}

/* CHART */

.chart-wrap {
  position: relative;
  width: 100%;
  height: 350px;
  background: #0b0e14;
  border-radius: 11px;
  overflow: hidden;
  touch-action: none;
}

#chart {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: crosshair;
}

.chart-info {
  min-height: 58px;
  margin-top: 11px;
  padding: 11px 13px;
  background: #0b0e14;
  border: 1px solid #202631;
  border-radius: 10px;
  color: #939baa;
  font-size: 12px;
  line-height: 1.5;
}

.chart-info strong {
  color: #f5f7fa;
}

.slider-area {
  margin-top: 13px;
}

#historySlider {
  width: 100%;
  height: 24px;
  accent-color: #f5f7fa;
  cursor: pointer;
  touch-action: none;
}

.slider-labels {
  display: flex;
  justify-content: space-between;
  color: #68717f;
  font-size: 10px;
}

.slider-current {
  text-align: center;
  margin-top: 5px;
  color: #c0c7d1;
  font-size: 11px;
}

/* NFL */

.nfl-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.game-card {
  background: #0b0e14;
  border: 1px solid #202631;
  border-radius: 13px;
  padding: 16px;
}

.game-title {
  font-size: 16px;
  font-weight: 800;
  color: #f5f7fa;
  margin-bottom: 3px;
}

.game-date {
  color: #697281;
  font-size: 11px;
  margin-bottom: 12px;
}

.team-row {
  padding: 12px 0;
  border-top: 1px solid #202631;
}

.team-name {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 8px;
}

.odds-row {
  display: flex;
  gap: 7px;
}

.odds-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex: 1;
  padding: 9px 11px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 800;
}

.yes-box {
  background: rgba(57,217,150,.09);
  border: 1px solid rgba(57,217,150,.28);
  color: #39d996;
}

.no-box {
  background: rgba(255,89,105,.09);
  border: 1px solid rgba(255,89,105,.28);
  color: #ff5969;
}

.odds-label {
  font-size: 10px;
  font-weight: 900;
  opacity: .85;
}

.odds-number {
  font-size: 14px;
  font-weight: 900;
}

.loading,
.empty {
  color: #737c8b;
  padding: 20px 0;
  font-size: 13px;
}

.error {
  color: #ff5969;
  background: #181015;
  border: 1px solid #38202a;
  padding: 13px;
  border-radius: 9px;
  font-size: 13px;
}

/* MOBILE */

@media (max-width: 850px) {
  .cards {
    grid-template-columns: repeat(2, 1fr);
  }

  .nfl-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 600px) {
  .container {
    width: 93%;
    padding-top: 20px;
  }

  .title {
    font-size: 23px;
  }

  .stat-card {
    min-height: 100px;
    padding: 15px;
  }

  .stat-value {
    font-size: 20px;
  }

  .panel-header {
    flex-direction: column;
    align-items: flex-start;
  }

  .periods {
    width: 100%;
  }

  .period-button {
    flex: 1;
  }

  .chart-wrap {
    height: 300px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">

    <div>
      <div class="title">
        Position Ledger
      </div>

      <div class="subtitle">
        Kalshi Trading Dashboard
      </div>
    </div>

    <div class="live-status">
      <span class="live-dot"></span>
      <span id="statusText">LIVE</span>
    </div>

  </div>


  <!-- ACCOUNT -->

  <div class="cards">

    <div class="card stat-card">
      <div class="stat-label">
        Available Balance
      </div>

      <div id="balance" class="stat-value">
        $0.00
      </div>
    </div>


    <div class="card stat-card">
      <div class="stat-label">
        Portfolio Value
      </div>

      <div id="portfolioValue" class="stat-value">
        $0.00
      </div>
    </div>


    <div class="card stat-card">
      <div class="stat-label">
        Total Account Value
      </div>

      <div id="totalValue" class="stat-value">
        $0.00
      </div>
    </div>


    <div class="card stat-card">
      <div class="stat-label">
        Live P/L
      </div>

      <div id="livePL" class="stat-value">
        $0.00
      </div>
    </div>

  </div>


  <!-- PERFORMANCE -->

  <div class="panel">

    <div class="panel-header">

      <div>
        <div class="panel-title">
          Account Performance
        </div>

        <div id="periodDescription" class="subtitle">
          Day — 1 minute intervals
        </div>
      </div>


      <div class="periods">

        <button class="period-button active" data-period="day">
          Day
        </button>

        <button class="period-button" data-period="week">
          Week
        </button>

        <button class="period-button" data-period="month">
          Month
        </button>

      </div>

    </div>


    <div class="chart-wrap">
      <canvas id="chart"></canvas>
    </div>


    <div id="chartInfo" class="chart-info">
      Drag across the graph or use the slider to inspect a timestamp.
    </div>


    <div class="slider-area">

      <input
        id="historySlider"
        type="range"
        min="0"
        max="0"
        value="0"
        step="1"
      >

      <div class="slider-labels">

        <span id="sliderStart">--</span>

        <span id="sliderEnd">--</span>

      </div>

      <div id="sliderCurrent" class="slider-current">
        --
      </div>

    </div>

  </div>


  <!-- NFL -->

  <div class="panel">

    <div class="panel-header">

      <div class="panel-title">
        NFL Markets
      </div>

      <div id="nflUpdated" class="subtitle">
        Loading...
      </div>

    </div>


    <div id="nflGrid" class="nfl-grid">

      <div class="loading">
        Loading NFL markets...
      </div>

    </div>

  </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const WORKER_URL =
  "https://worker1.ryderolinger1.workers.dev";

const HISTORY_KEY =
  "kalshi_pl_history_v1";


/* =========================================================
   PERIODS
========================================================= */

const PERIODS = {

  day: {
    duration: 24 * 60 * 60 * 1000,
    interval: 60 * 1000,
    label: "Day — 1 minute intervals"
  },

  week: {
    duration: 7 * 24 * 60 * 60 * 1000,
    interval: 10 * 60 * 1000,
    label: "Week — 10 minute intervals"
  },

  month: {
    duration: 30 * 24 * 60 * 60 * 1000,
    interval: 60 * 60 * 1000,
    label: "Month — 1 hour intervals"
  }

};


let currentPeriod = "day";
let history = [];
let visibleHistory = [];
let selectedIndex = null;
let dragging = false;
let lastSavedTime = 0;


/* =========================================================
   DOM
========================================================= */

const canvas =
  document.getElementById("chart");

const ctx =
  canvas.getContext("2d");

const slider =
  document.getElementById("historySlider");


/* =========================================================
   MONEY
========================================================= */

function money(value) {

  return Number(value || 0).toLocaleString(
    "en-US",
    {
      style: "currency",
      currency: "USD"
    }
  );

}


/* =========================================================
   HISTORY
========================================================= */

function loadHistory() {

  try {

    const saved =
      localStorage.getItem(HISTORY_KEY);

    if (!saved) {
      history = [];
      return;
    }

    const parsed =
      JSON.parse(saved);

    if (!Array.isArray(parsed)) {
      history = [];
      return;
    }

    history =
      parsed
        .filter(p =>
          p &&
          Number.isFinite(Number(p.time)) &&
          Number.isFinite(Number(p.value))
        )
        .map(p => ({
          time: Number(p.time),
          value: Number(p.value),
          pnl:
            p.pnl === null ||
            p.pnl === undefined
              ? null
              : Number(p.pnl)
        }))
        .sort((a,b) => a.time - b.time);

  } catch {

    history = [];

  }

}


function saveHistoryPoint(value, pnl) {

  const now =
    Date.now();

  if (
    now - lastSavedTime < 9000
  ) {
    return;
  }

  lastSavedTime = now;

  history.push({
    time: now,
    value: Number(value) || 0,
    pnl:
      Number.isFinite(Number(pnl))
        ? Number(pnl)
        : null
  });

  const cutoff =
    now -
    31 * 24 * 60 * 60 * 1000;

  history =
    history.filter(
      p => p.time >= cutoff
    );

  try {

    localStorage.setItem(
      HISTORY_KEY,
      JSON.stringify(history)
    );

  } catch {}

}


/* =========================================================
   TIME
========================================================= */

function dateTime(timestamp) {

  return new Date(timestamp).toLocaleString(
    "en-US",
    {
      month: "short",
      day: "numeric",
      year: "numeric",
      hour: "numeric",
      minute: "2-digit",
      second: "2-digit"
    }
  );

}


function graphTime(timestamp) {

  const date =
    new Date(timestamp);

  if (currentPeriod === "month") {

    return date.toLocaleString(
      "en-US",
      {
        month: "short",
        day: "numeric",
        hour: "numeric"
      }
    );

  }

  if (currentPeriod === "week") {

    return date.toLocaleString(
      "en-US",
      {
        weekday: "short",
        hour: "numeric",
        minute: "2-digit"
      }
    );

  }

  return date.toLocaleTimeString(
    "en-US",
    {
      hour: "numeric",
      minute: "2-digit"
    }
  );

}


/* =========================================================
   GRAPH DATA
========================================================= */

function buildVisibleHistory() {

  const config =
    PERIODS[currentPeriod];

  const now =
    Date.now();

  const start =
    now - config.duration;

  const source =
    history
      .filter(
        p =>
          p.time >= start &&
          p.time <= now
      )
      .sort(
        (a,b) => a.time - b.time
      );

  if (!source.length) {

    visibleHistory = [];

    return;

  }

  const buckets =
    new Map();

  for (const point of source) {

    const bucket =
      Math.floor(
        point.time / config.interval
      ) * config.interval;

    buckets.set(
      bucket,
      {
        time: bucket,
        value: point.value,
        pnl: point.pnl
      }
    );

  }

  visibleHistory =
    Array.from(
      buckets.values()
    ).sort(
      (a,b) => a.time - b.time
    );

}


/* =========================================================
   CHART
========================================================= */

function resizeCanvas() {

  const rect =
    canvas.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;

  canvas.width =
    Math.round(rect.width * dpr);

  canvas.height =
    Math.round(rect.height * dpr);

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

}


function drawChart() {

  resizeCanvas();

  const rect =
    canvas.getBoundingClientRect();

  const width =
    rect.width;

  const height =
    rect.height;

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  if (!visibleHistory.length) {

    ctx.fillStyle = "#737c8b";
    ctx.font = "13px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
      "Waiting for history...",
      width / 2,
      height / 2
    );

    return;

  }

  const left = 58;
  const right = 20;
  const top = 20;
  const bottom = 42;

  const graphWidth =
    width - left - right;

  const graphHeight =
    height - top - bottom;

  const values =
    visibleHistory.map(
      p => Number(p.value)
    );

  let min =
    Math.min(...values);

  let max =
    Math.max(...values);

  if (min === max) {
    min -= 1;
    max += 1;
  }

  const padding =
    (max - min) * .12;

  min -= padding;
  max += padding;

  function x(index) {

    if (visibleHistory.length === 1) {
      return left + graphWidth / 2;
    }

    return left +
      (
        index /
        (visibleHistory.length - 1)
      ) *
      graphWidth;

  }

  function y(value) {

    return top +
      (
        1 -
        ((value - min) / (max - min))
      ) *
      graphHeight;

  }


  /* GRID */

  ctx.strokeStyle =
    "#202631";

  ctx.lineWidth = 1;

  for (let i = 0; i <= 4; i++) {

    const yy =
      top +
      (i / 4) * graphHeight;

    ctx.beginPath();

    ctx.moveTo(left, yy);

    ctx.lineTo(
      width - right,
      yy
    );

    ctx.stroke();

    const label =
      max -
      (i / 4) * (max - min);

    ctx.fillStyle =
      "#697281";

    ctx.font =
      "10px Arial";

    ctx.textAlign =
      "right";

    ctx.fillText(
      money(label),
      left - 8,
      yy + 3
    );

  }


  /* LINE */

  ctx.beginPath();

  visibleHistory.forEach(
    (point,index) => {

      const xx = x(index);
      const yy = y(point.value);

      if (index === 0) {
        ctx.moveTo(xx, yy);
      } else {
        ctx.lineTo(xx, yy);
      }

    }
  );

  ctx.strokeStyle =
    "#e8edf3";

  ctx.lineWidth =
    2.2;

  ctx.lineJoin =
    "round";

  ctx.lineCap =
    "round";

  ctx.stroke();


  /* ONE INSPECTION LINE */

  if (
    selectedIndex !== null &&
    visibleHistory[selectedIndex]
  ) {

    const point =
      visibleHistory[selectedIndex];

    const xx =
      x(selectedIndex);

    const yy =
      y(point.value);

    ctx.beginPath();

    ctx.setLineDash([4,5]);

    ctx.moveTo(
      xx,
      top
    );

    ctx.lineTo(
      xx,
      height - bottom
    );

    ctx.strokeStyle =
      "#78818f";

    ctx.lineWidth = 1;

    ctx.stroke();

    ctx.setLineDash([]);


    ctx.beginPath();

    ctx.arc(
      xx,
      yy,
      5,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "#ffffff";

    ctx.fill();

  }


  /* TIME LABELS */

  const count =
    visibleHistory.length;

  if (count) {

    const indexes = [];

    if (count <= 5) {

      for (
        let i = 0;
        i < count;
        i++
      ) {
        indexes.push(i);
      }

    } else {

      indexes.push(0);

      indexes.push(
        Math.floor((count - 1) * .25)
      );

      indexes.push(
        Math.floor((count - 1) * .5)
      );

      indexes.push(
        Math.floor((count - 1) * .75)
      );

      indexes.push(count - 1);

    }

    ctx.fillStyle =
      "#697281";

    ctx.font =
      "10px Arial";

    ctx.textAlign =
      "center";

    indexes.forEach(index => {

      ctx.fillText(
        graphTime(
          visibleHistory[index].time
        ),
        x(index),
        height - 13
      );

    });

  }

}


/* =========================================================
   SLIDER
========================================================= */

function updateSlider() {

  if (!visibleHistory.length) {

    slider.max = 0;
    slider.value = 0;

    document.getElementById(
      "sliderStart"
    ).textContent = "--";

    document.getElementById(
      "sliderEnd"
    ).textContent = "--";

    document.getElementById(
      "sliderCurrent"
    ).textContent = "--";

    return;

  }

  slider.max =
    visibleHistory.length - 1;

  if (selectedIndex === null) {

    selectedIndex =
      visibleHistory.length - 1;

  }

  selectedIndex =
    Math.max(
      0,
      Math.min(
        selectedIndex,
        visibleHistory.length - 1
      )
    );

  slider.value =
    selectedIndex;

  document.getElementById(
    "sliderStart"
  ).textContent =
    graphTime(
      visibleHistory[0].time
    );

  document.getElementById(
    "sliderEnd"
  ).textContent =
    graphTime(
      visibleHistory[
        visibleHistory.length - 1
      ].time
    );

  document.getElementById(
    "sliderCurrent"
  ).textContent =
    dateTime(
      visibleHistory[
        selectedIndex
      ].time
    );

}


function inspectIndex(index) {

  if (!visibleHistory.length) {
    return;
  }

  selectedIndex =
    Math.max(
      0,
      Math.min(
        visibleHistory.length - 1,
        Math.round(index)
      )
    );

  drawChart();
  updateSlider();

  const point =
    visibleHistory[selectedIndex];

  const pnl =
    point.pnl;

  document.getElementById(
    "chartInfo"
  ).innerHTML = `

    <strong>
      ${dateTime(point.time)}
    </strong>

    &nbsp; • &nbsp;

    Account Value:
    <strong>
      ${money(point.value)}
    </strong>

    &nbsp; • &nbsp;

    P/L:

    ${
      pnl === null
        ? `<strong>P/L not recorded</strong>`
        : `
          <strong class="${pnl >= 0 ? "green" : "red"}">
            ${pnl >= 0 ? "+" : ""}
            ${money(pnl)}
          </strong>
        `
    }

  `;

}


function pointerToIndex(event) {

  if (visibleHistory.length < 2) {
    return 0;
  }

  const rect =
    canvas.getBoundingClientRect();

  const left = 58;
  const right = 20;

  let position =
    event.clientX - rect.left;

  position =
    Math.max(
      left,
      Math.min(
        rect.width - right,
        position
      )
    );

  const ratio =
    (position - left) /
    (rect.width - left - right);

  return ratio *
    (visibleHistory.length - 1);

}


/* =========================================================
   GRAPH TOUCH / DRAG
========================================================= */

canvas.addEventListener(
  "pointerdown",
  event => {

    if (!visibleHistory.length) {
      return;
    }

    dragging = true;

    canvas.setPointerCapture(
      event.pointerId
    );

    inspectIndex(
      pointerToIndex(event)
    );

  }
);


canvas.addEventListener(
  "pointermove",
  event => {

    if (!dragging) {
      return;
    }

    inspectIndex(
      pointerToIndex(event)
    );

  }
);


canvas.addEventListener(
  "pointerup",
  () => {
    dragging = false;
  }
);


canvas.addEventListener(
  "pointercancel",
  () => {
    dragging = false;
  }
);


slider.addEventListener(
  "input",
  event => {

    inspectIndex(
      Number(event.target.value)
    );

  }
);


/* =========================================================
   PERIOD BUTTONS
========================================================= */

document
  .querySelectorAll(".period-button")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        currentPeriod =
          button.dataset.period;

        document
          .querySelectorAll(".period-button")
          .forEach(item => {

            item.classList.remove(
              "active"
            );

          });

        button.classList.add(
          "active"
        );

        document.getElementById(
          "periodDescription"
        ).textContent =
          PERIODS[
            currentPeriod
          ].label;

        selectedIndex = null;

        document.getElementById(
          "chartInfo"
        ).innerHTML =
          "Drag across the graph or use the slider to inspect a timestamp.";

        refreshChart();

      }
    );

  });


/* =========================================================
   PORTFOLIO
========================================================= */

async function loadPortfolio() {

  try {

    const response =
      await fetch(
        WORKER_URL +
        "/api/portfolio?t=" +
        Date.now(),
        {
          cache: "no-store"
        }
      );

    const data =
      await response.json();

    if (!response.ok || !data.ok) {
      throw new Error(
        "Portfolio request failed"
      );
    }

    const balanceRaw =
      Number(
        data.balance?.balance ??
        data.balance?.available_balance ??
        0
      );

    const balance =
      balanceRaw / 100;

    const positions =
      Array.isArray(
        data.positions?.market_positions
      )
        ? data.positions.market_positions
        : Array.isArray(
            data.positions?.positions
          )
          ? data.positions.positions
          : [];

    let portfolioValue = 0;

    for (const position of positions) {

      const marketValue =
        Number(
          position.market_value ??
          position.market_value_cents ??
          0
        );

      if (
        Number.isFinite(
          marketValue
        )
      ) {

        portfolioValue +=
          marketValue / 100;

      }

    }

    if (
      Number.isFinite(
        Number(
          data.positions?.market_value
        )
      )
    ) {

      portfolioValue =
        Number(
          data.positions.market_value
        ) / 100;

    }

    const total =
      balance +
      portfolioValue;

    let pnl = null;

    const pnlCandidates = [

      data.positions?.total_pnl,

      data.positions?.pnl,

      data.positions?.profit_loss,

      data.balance?.pnl

    ];

    for (
      const candidate
      of pnlCandidates
    ) {

      if (
        candidate !== undefined &&
        candidate !== null &&
        Number.isFinite(
          Number(candidate)
        )
      ) {

        pnl =
          Number(candidate);

        if (
          Math.abs(pnl) > 10000
        ) {

          pnl /= 100;

        }

        break;

      }

    }

    if (pnl === null) {

      if (history.length) {

        pnl =
          total -
          history[0].value;

      } else {

        pnl = 0;

      }

    }

    document.getElementById(
      "balance"
    ).textContent =
      money(balance);

    document.getElementById(
      "portfolioValue"
    ).textContent =
      money(portfolioValue);

    document.getElementById(
      "totalValue"
    ).textContent =
      money(total);

    const pnlElement =
      document.getElementById("livePL");

    pnlElement.textContent =
      (pnl >= 0 ? "+" : "") +
      money(pnl);

    pnlElement.classList.remove(
      "green",
      "red"
    );

    pnlElement.classList.add(
      pnl >= 0
        ? "green"
        : "red"
    );

    saveHistoryPoint(
      total,
      pnl
    );

    refreshChart();

    document.getElementById(
      "statusText"
    ).textContent =
      "LIVE • " +
      new Date().toLocaleTimeString(
        "en-US",
        {
          hour: "numeric",
          minute: "2-digit"
        }
      );

  } catch (error) {

    console.error(
      "Portfolio error:",
      error
    );

    document.getElementById(
      "statusText"
    ).textContent =
      "CONNECTION ERROR";

  }

}


/* =========================================================
   NFL TEAM DATABASE
========================================================= */

const NFL_TEAMS = {

  ARI: "Arizona Cardinals",
  ATL: "Atlanta Falcons",
  BAL: "Baltimore Ravens",
  BUF: "Buffalo Bills",
  CAR: "Carolina Panthers",
  CHI: "Chicago Bears",
  CIN: "Cincinnati Bengals",
  CLE: "Cleveland Browns",
  DAL: "Dallas Cowboys",
  DEN: "Denver Broncos",
  DET: "Detroit Lions",
  GB: "Green Bay Packers",
  GNB: "Green Bay Packers",
  HOU: "Houston Texans",
  IND: "Indianapolis Colts",
  JAX: "Jacksonville Jaguars",
  KC: "Kansas City Chiefs",
  KAN: "Kansas City Chiefs",
  LAC: "Los Angeles Chargers",
  LAR: "Los Angeles Rams",
  LV: "Las Vegas Raiders",
  MIA: "Miami Dolphins",
  MIN: "Minnesota Vikings",
  NE: "New England Patriots",
  NO: "New Orleans Saints",
  NYG: "New York Giants",
  NYJ: "New York Jets",
  PHI: "Philadelphia Eagles",
  PIT: "Pittsburgh Steelers",
  SEA: "Seattle Seahawks",
  SF: "San Francisco 49ers",
  SFO: "San Francisco 49ers",
  TB: "Tampa Bay Buccaneers",
  TEN: "Tennessee Titans",
  WAS: "Washington Commanders"

};


/*
  IMPORTANT:

  Some Kalshi NFL event tickers look like:

  26SEP28PHICHI
  26SEP27LARDEN
  26SEP27BALDAL
  26SEP27LVNO
  26SEP27MINTB
  26SEP27ARISF

  We decode the team abbreviations directly.
*/


const NFL_CODES =
  Object.keys(NFL_TEAMS)
    .sort(
      (a,b) =>
        b.length - a.length
    );


/* =========================================================
   GET EVENT TICKER
========================================================= */

function getEventTicker(markets) {

  for (const market of markets) {

    if (market.event_ticker) {

      return String(
        market.event_ticker
      ).toUpperCase();

    }

  }

  return "";

}


/* =========================================================
   EXTRACT TWO TEAMS FROM KALSHI TICKER
========================================================= */

function teamsFromTicker(ticker) {

  /*
    Remove the date portion.

    Example:

      26SEP27LARDEN
          ↓
      LARDEN
  */

  let value =
    String(ticker || "")
      .toUpperCase()
      .replace(/^KXNFLGAME[-_]?/i, "")
      .replace(/^\d{2}[A-Z]{3}\d{2}/, "")
      .replace(/[-_]/g, "");


  const found = [];


  /*
    First try every possible pair of
    known NFL codes.

    This handles:
      PHICHI
      LARDEN
      BALDAL
      LVNO
      MINTB
      ARISF
  */

  for (
    const first of NFL_CODES
  ) {

    if (
      !value.startsWith(first)
    ) {

      continue;

    }


    const remainder =
      value.slice(
        first.length
      );


    for (
      const second of NFL_CODES
    ) {

      if (
        remainder === second
      ) {

        return [
          NFL_TEAMS[first],
          NFL_TEAMS[second]
        ];

      }

    }

  }


  /*
    Try finding two codes anywhere
    in the remaining ticker.
  */

  for (
    const first of NFL_CODES
  ) {

    const firstIndex =
      value.indexOf(first);

    if (
      firstIndex === -1
    ) {

      continue;

    }

    const remainder =
      value.slice(
        firstIndex +
        first.length
      );


    for (
      const second of NFL_CODES
    ) {

      if (
        remainder.endsWith(second)
      ) {

        return [
          NFL_TEAMS[first],
          NFL_TEAMS[second]
        ];

      }

    }

  }


  return [];

}


/* =========================================================
   FALLBACK TEAM NAME
========================================================= */

function cleanTeamName(name) {

  if (!name) {
    return "";
  }

  let value =
    String(name)
      .trim()
      .replace(/^YES\s+/i, "")
      .replace(/^NO\s+/i, "")
      .trim();

  const upper =
    value
      .toUpperCase()
      .replace(/[^A-Z]/g, "");

  if (NFL_TEAMS[upper]) {
    return NFL_TEAMS[upper];
  }

  return value;

}


/* =========================================================
   GET TEAM FROM MARKET
========================================================= */

function getMarketTeam(market) {

  /*
    Try explicit fields first.
  */

  const candidates = [

    market.yes_sub_title,

    market.yes_title,

    market.subtitle,

    market.team_name,

    market.team

  ];


  for (
    const candidate
    of candidates
  ) {

    if (!candidate) {
      continue;
    }

    const cleaned =
      cleanTeamName(candidate);

    if (!cleaned) {
      continue;
    }

    /*
      Don't accept generic words such
      as "Winner" as the team name.
    */

    if (
      /^(winner|win|yes|no|team)$/i.test(
        cleaned
      )
    ) {
      continue;
    }

    return cleaned;

  }


  return "";

}


/* =========================================================
   GET GAME KEY
========================================================= */

function getGameKey(market) {

  if (market.event_ticker) {

    return String(
      market.event_ticker
    );

  }

  if (market.event_id) {

    return String(
      market.event_id
    );

  }

  const ticker =
    String(
      market.ticker || ""
    );

  return ticker
    .split("-")
    .slice(0,-1)
    .join("-");

}


/* =========================================================
   GET GAME TITLE
========================================================= */

function getGameTitle(gameMarkets) {

  /*
    FIRST:
    Decode the event ticker.

    This is the important fix.
  */

  const eventTicker =
    getEventTicker(
      gameMarkets
    );


  const decoded =
    teamsFromTicker(
      eventTicker
    );


  if (
    decoded.length === 2
  ) {

    return (
      decoded[0] +
      " vs. " +
      decoded[1]
    );

  }


  /*
    SECOND:
    Try explicit market team names.
  */

  const teams = [];


  for (
    const market
    of gameMarkets
  ) {

    const team =
      getMarketTeam(market);

    if (
      team &&
      !teams.includes(team)
    ) {

      teams.push(team);

    }

  }


  if (teams.length >= 2) {

    return (
      teams[0] +
      " vs. " +
      teams[1]
    );

  }


  /*
    Last fallback.
  */

  return "NFL Game";

}


/* =========================================================
   GET TEAM NAMES FOR GAME
========================================================= */

function getGameTeams(gameMarkets) {

  const eventTicker =
    getEventTicker(
      gameMarkets
    );


  const decoded =
    teamsFromTicker(
      eventTicker
    );


  /*
    If ticker successfully decoded,
    use those exact names.
  */

  if (
    decoded.length === 2
  ) {

    return decoded;

  }


  /*
    Otherwise use market names.
  */

  const teams = [];


  for (
    const market
    of gameMarkets
  ) {

    const team =
      getMarketTeam(market);

    if (
      team &&
      !teams.includes(team)
    ) {

      teams.push(team);

    }

  }


  return teams;

}


/* =========================================================
   PERCENT
========================================================= */

function percent(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return null;

  }

  let n =
    Number(
      String(value)
        .replace("$","")
        .replace("%","")
        .trim()
    );

  if (!Number.isFinite(n)) {
    return null;
  }

  /*
    Decimal:
      .64 → 64%
  */

  if (
    n >= 0 &&
    n <= 1
  ) {

    n *= 100;

  }

  return Math.max(
    0,
    Math.min(
      100,
      n
    )
  );

}


/* =========================================================
   GET MARKET ODDS
========================================================= */

function getOdds(market) {

  let yes = null;

  const lastCandidates = [

    market.last_price_dollars,

    market.last_price,

    market.yes_last_price_dollars,

    market.yes_last_price,

    market.last_trade_price_dollars,

    market.last_trade_price

  ];


  for (
    const candidate
    of lastCandidates
  ) {

    yes =
      percent(candidate);

    if (
      yes !== null
    ) {

      break;

    }

  }


  /*
    Bid / ask midpoint.
  */

  if (yes === null) {

    const bid =
      percent(
        market.yes_bid_dollars ??
        market.yes_bid ??
        market.yes_bid_price
      );

    const ask =
      percent(
        market.yes_ask_dollars ??
        market.yes_ask ??
        market.yes_ask_price
      );


    if (
      bid !== null &&
      ask !== null
    ) {

      yes =
        (bid + ask) / 2;

    } else if (
      ask !== null
    ) {

      yes = ask;

    } else if (
      bid !== null
    ) {

      yes = bid;

    }

  }


  /*
    Older fields.
  */

  if (yes === null) {

    const candidates = [

      market.yes_price,

      market.yes_price_dollars,

      market.price

    ];


    for (
      const candidate
      of candidates
    ) {

      yes =
        percent(candidate);

      if (
        yes !== null
      ) {

        break;

      }

    }

  }


  /*
    Explicit NO if Kalshi provides it.
  */

  let no =
    percent(
      market.no_price_dollars ??
      market.no_price ??
      market.no_last_price_dollars ??
      market.no_last_price
    );


  /*
    Otherwise binary market:
    NO = 100 - YES.
  */

  if (
    no === null &&
    yes !== null
  ) {

    no =
      100 - yes;

  }


  return {
    yes,
    no
  };

}


/* =========================================================
   FIND MARKET FOR TEAM
========================================================= */

function findMarketForTeam(
  gameMarkets,
  team
) {

  /*
    Try ticker code first.
  */

  const teamCode =
    Object.keys(NFL_TEAMS)
      .find(
        code =>
          NFL_TEAMS[code] === team
      );


  if (teamCode) {

    for (
      const market
      of gameMarkets
    ) {

      const text =
        (
          String(
            market.ticker || ""
          ) +
          " " +
          String(
            market.yes_sub_title || ""
          ) +
          " " +
          String(
            market.subtitle || ""
          )
        ).toUpperCase();


      if (
        new RegExp(
          `\\b${teamCode}\\b`
        ).test(text)
      ) {

        return market;

      }

    }

  }


  /*
    Try market team name.
  */

  for (
    const market
    of gameMarkets
  ) {

    const marketTeam =
      getMarketTeam(market);

    if (
      marketTeam === team
    ) {

      return market;

    }

  }


  return null;

}


/* =========================================================
   NFL DATE
========================================================= */

function getGameDate(gameMarkets) {

  for (
    const market
    of gameMarkets
  ) {

    const candidates = [

      market.expected_expiration_time,

      market.close_time,

      market.expiration_time,

      market.end_time

    ];


    for (
      const value
      of candidates
    ) {

      if (!value) {
        continue;
      }

      const date =
        new Date(value);

      if (
        !Number.isNaN(
          date.getTime()
        )
      ) {

        return date.toLocaleString(
          "en-US",
          {
            weekday: "short",
            month: "short",
            day: "numeric",
            hour: "numeric",
            minute: "2-digit"
          }
        );

      }

    }

  }

  return "";

}


/* =========================================================
   NFL LOAD
========================================================= */

async function loadNFL() {

  const grid =
    document.getElementById(
      "nflGrid"
    );


  try {

    const response =
      await fetch(
        WORKER_URL +
        "/api/nfl?t=" +
        Date.now(),
        {
          cache: "no-store"
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        "NFL feed error"
      );

    }


    const markets =
      Array.isArray(
        data.markets
      )
        ? data.markets
        : [];


    if (!markets.length) {

      grid.innerHTML = `
        <div class="empty">
          No open NFL markets found.
        </div>
      `;

      return;

    }


    /*
      Group markets by event.
    */

    const games =
      new Map();


    for (
      const market
      of markets
    ) {

      const key =
        getGameKey(market);


      if (
        !games.has(key)
      ) {

        games.set(
          key,
          []
        );

      }


      games
        .get(key)
        .push(market);

    }


    grid.innerHTML = "";


    /*
      Render each game.
    */

    for (
      const [
        gameKey,
        gameMarkets
      ]
      of games
    ) {

      const gameCard =
        document.createElement(
          "div"
        );

      gameCard.className =
        "game-card";


      /*
        FIXED FULL GAME NAME.
      */

      const title =
        document.createElement(
          "div"
        );

      title.className =
        "game-title";

      title.textContent =
        getGameTitle(
          gameMarkets
        );

      gameCard.appendChild(
        title
      );


      const date =
        getGameDate(
          gameMarkets
        );


      if (date) {

        const dateElement =
          document.createElement(
            "div"
          );

        dateElement.className =
          "game-date";

        dateElement.textContent =
          date;

        gameCard.appendChild(
          dateElement
        );

      }


      /*
        Get exact two NFL teams.
      */

      const teams =
        getGameTeams(
          gameMarkets
        );


      /*
        Render each team.
      */

      for (
        const team
        of teams
      ) {

        const market =
          findMarketForTeam(
            gameMarkets,
            team
          );


        if (!market) {
          continue;
        }


        const odds =
          getOdds(market);


        const teamRow =
          document.createElement(
            "div"
          );

        teamRow.className =
          "team-row";


        const teamName =
          document.createElement(
            "div"
          );

        teamName.className =
          "team-name";

        teamName.textContent =
          team;


        teamRow.appendChild(
          teamName
        );


        /*
          YES + NO boxes.
        */

        const oddsRow =
          document.createElement(
            "div"
          );

        oddsRow.className =
          "odds-row";


        const yesBox =
          document.createElement(
            "div"
          );

        yesBox.className =
          "odds-box yes-box";

        yesBox.innerHTML = `

          <span class="odds-label">
            YES
          </span>

          <span class="odds-number">
            ${
              odds.yes === null
                ? "--"
                : odds.yes.toFixed(1) + "%"
            }
          </span>

        `;


        const noBox =
          document.createElement(
            "div"
          );

        noBox.className =
          "odds-box no-box";

        noBox.innerHTML = `

          <span class="odds-label">
            NO
          </span>

          <span class="odds-number">
            ${
              odds.no === null
                ? "--"
                : odds.no.toFixed(1) + "%"
            }
          </span>

        `;


        oddsRow.appendChild(
          yesBox
        );

        oddsRow.appendChild(
          noBox
        );


        teamRow.appendChild(
          oddsRow
        );


        gameCard.appendChild(
          teamRow
        );

      }


      grid.appendChild(
        gameCard
      );

    }


    document.getElementById(
      "nflUpdated"
    ).textContent =
      "Updated " +
      new Date().toLocaleTimeString(
        "en-US",
        {
          hour: "numeric",
          minute: "2-digit"
        }
      );


  } catch (error) {

    console.error(
      "NFL error:",
      error
    );


    grid.innerHTML = `
      <div class="error">
        NFL feed error
      </div>
    `;

  }

}
