<script>


/* =========================================================
WORKER URL
========================================================= */

const WORKER_URL =
"https://worker1.ryderolinger1.workers.dev";


/* =========================================================
HELPERS
========================================================= */

function $(id) {

return document.getElementById(
id
);

}


function showMessage(
message
) {

const box =
$("message");

box.textContent =
message;

box.style.display =
"block";

setTimeout(
() => {

box.style.display =
"none";

},
3000
);

}


/* =========================================================
API
========================================================= */

async function api(
path,
options = {}
) {

const response =
await fetch(
WORKER_URL + path,
{
cache:
"no-store",

...options,

headers: {

"Content-Type":
"application/json",

...(options.headers || {})

}

}
);

const text =
await response.text();

let data;

try {

data =
text
? JSON.parse(text)
: {};

}

catch {

data =
{
raw:
text
};

}

if (
!response.ok
) {

throw new Error(
data.error ||
data.message ||
`HTTP ${response.status}`
);

}

return data;

}


/* =========================================================
STATUS
========================================================= */

async function loadStatus() {

try {

const status =
await api(
"/api/auto-trade/status"
);


$("status").textContent =
status.enabled
? "REAL TRADING ON"
: "REAL TRADING OFF";


$("status").className =
status.enabled
? "status on"
: "status off";


$("maxTradeCard").textContent =
"$" +
Number(
status.maxTrade ??
5
).toFixed(2);


$("maxDayCard").textContent =
"$" +
Number(
status.maxDay ??
20
).toFixed(2);


$("spentCard").textContent =
"$" +
Number(
status.spentToday ??
0
).toFixed(2);


const entries =
status.entries ||
status.openPositions ||
[];


$("positionsCard").textContent =
entries.length;


const filters =
status.filters ||
{};


$("maxTrade").value =
Number(
status.maxTrade ??
5
);


$("maxDay").value =
Number(
status.maxDay ??
20
);


$("takeProfit").value =
(
Number(
status.takeProfit ??
0.25
) *
100
).toFixed(0);


$("minMinutes").value =
Number(
filters.minMinutesToClose ??
180
);


$("minEdge").value =
(
Number(
filters.minEdge ??
0.10
) *
100
).toFixed(1);


$("minMove").value =
(
Number(
filters.minExpectedPriceMove ??
0.01
) *
100
).toFixed(0);


renderPositions(
entries
);

}
catch (
error
) {

showMessage(
"Status error: " +
error.message
);

}

}


/* =========================================================
SAVE SETTINGS
========================================================= */

async function saveSettings() {

try {

await api(
"/api/auto-trade/settings",
{

method:
"POST",

body:
JSON.stringify({

maxTrade:
Number(
$("maxTrade").value
),

maxDay:
Number(
$("maxDay").value
),

takeProfit:
Number(
$("takeProfit").value
) / 100,

minMinutesToClose:
Number(
$("minMinutes").value
),

minEdge:
Number(
$("minEdge").value
) / 100,

minExpectedPriceMove:
Number(
$("minMove").value
) / 100

})

}
);


showMessage(
"Settings saved."
);

await refreshAll();

}
catch (
error
) {

showMessage(
"Could not save settings: " +
error.message
);

}

}


/* =========================================================
START TRADING
========================================================= */

async function startTrading() {

const confirmation =
prompt(
'Type exactly: ENABLE REAL TRADING'
);

if (
confirmation !==
"ENABLE REAL TRADING"
) {

showMessage(
"Trading was not enabled."
);

return;

}

try {

await api(
"/api/auto-trade/start",
{

method:
"POST",

body:
JSON.stringify({

confirmation

})

}
);


showMessage(
"REAL TRADING ENABLED"
);

await refreshAll();

}
catch (
error
) {

showMessage(
"Could not start trading: " +
error.message
);

}

}


/* =========================================================
STOP TRADING
========================================================= */

async function stopTrading() {

try {

await api(
"/api/auto-trade/stop",
{

method:
"POST"

}
);


showMessage(
"REAL TRADING STOPPED"
);

await refreshAll();

}
catch (
error
) {

showMessage(
"Could not stop trading: " +
error.message
);

}

}


/* =========================================================
NUMBER HELPERS
========================================================= */

function getNumber(
obj,
...keys
) {

for (
const key of keys
) {

if (
obj &&
obj[key] !== undefined &&
obj[key] !== null &&
obj[key] !== ""
) {

const n =
Number(
obj[key]
);

if (
Number.isFinite(n)
) {

return n;

}

}

}

return null;

}


/* =========================================================
MARKET VALUES

THE WORKER ALREADY REVERSES THESE.

HTML DOES NOT REVERSE THEM.
========================================================= */

function getEdge(
market
) {

const value =
Number(
market?.edge
);

return Number.isFinite(
value
)
? value * 100
: null;

}


function getExpectedMove(
market
) {

const value =
Number(
market?.expectedMove
);

return Number.isFinite(
value
)
? value * 100
: null;

}


function getModelProbability(
market
) {

const value =
Number(
market?.modelProbability
);

return Number.isFinite(
value
)
? value * 100
: null;

}


function getMinutes(
market
) {

return getNumber(
market,
"minutesToClose",
"minutes_to_close"
);

}


function getPrice(
market
) {

const value =
Number(
market?.entryPrice
);

return Number.isFinite(
value
)
? value
: null;

}


/* =========================================================
SETTLEMENT
========================================================= */

function getSettlementText(
market
) {

if (
market?.settlement?.label
) {

return market.settlement.label;

}

if (
market?.settlement
) {

if (
typeof market.settlement ===
"string"
) {

return market.settlement;

}

}

if (
market?.title
) {

return market.title;

}

return "Unknown";

}


/* =========================================================
DIAGNOSTICS

USES THE EXACT SAME VALUES AS AUTO-BUYER.
========================================================= */

function buildDiagnostics(
market,
filters
) {

const checks = [];


const minMinutes =
Number(
filters.minMinutesToClose ??
180
);


const minEdge =
Number(
filters.minEdge ??
0.10
) * 100;


const minMove =
Number(
filters.minExpectedPriceMove ??
0.01
) * 100;


/*
TIME
*/

const minutes =
getMinutes(
market
);

let timePass =
false;

let timeDetail =
"";


if (
minutes === null
) {

timeDetail =
"No close-time information.";

}
else {

timePass =
minutes >=
minMinutes;

timeDetail =
`${minutes.toFixed(0)} min remaining • required ${minMinutes} min`;

}


checks.push({

name:
"Time until close",

pass:
timePass,

detail:
timeDetail

});


/*
EDGE
*/

const edge =
getEdge(
market
);

let edgePass =
false;

let edgeDetail =
"";


if (
edge === null
) {

edgeDetail =
"Weather-model edge unavailable.";

}
else {

edgePass =
edge >=
minEdge;

edgeDetail =
`${edge >= 0 ? "+" : ""}${edge.toFixed(1)}% • required +${minEdge.toFixed(1)}%`;

}


checks.push({

name:
"Weather model edge",

pass:
edgePass,

detail:
edgeDetail

});


/*
EXPECTED MOVE
*/

const move =
getExpectedMove(
market
);

let movePass =
false;

let moveDetail =
"";


if (
move === null
) {

moveDetail =
"Expected move unavailable.";

}
else {

movePass =
move >=
minMove;

moveDetail =
`${move.toFixed(0)}¢ expected • required ${minMove.toFixed(0)}¢`;

}


checks.push({

name:
"Expected price move",

pass:
movePass,

detail:
moveDetail

});


/*
OVERALL
*/

const failed =
checks.filter(
x =>
!x.pass
);


return {

checks,

eligible:
failed.length === 0,

reason:
failed.length
? failed
.map(
x =>
`${x.name}: ${x.detail}`
)
.join(" | ")
: "Every auto-trader filter passes."

};

}


/* =========================================================
RENDER MARKET
========================================================= */

function renderMarket(
market,
filters
) {

const edge =
getEdge(
market
);

const move =
getExpectedMove(
market
);

const model =
getModelProbability(
market
);

const price =
getPrice(
market
);

const minutes =
getMinutes(
market
);

const diagnostics =
buildDiagnostics(
market,
filters
);

const side =
String(
market?.side ??
""
).toUpperCase();


return `

<div class="market">

<div class="market-header">

<div>

<div class="market-title">

${
market?.city ??
"Unknown City"
}

</div>

<div class="market-subtitle">

${
market?.title ??
market?.ticker ??
""
}

</div>

<div class="market-subtitle">

Settlement:
<strong>
${getSettlementText(
market
)}
</strong>

${
minutes !== null
? ` • ${minutes.toFixed(0)} min until close`
: ""
}

</div>

</div>


<div class="side">

${side}

</div>

</div>


<div class="metrics">


<div class="metric">

<div class="metric-label">
Kalshi
</div>

<div class="metric-value">

${
price !== null
? price.toFixed(0) + "¢"
: "—"
}

</div>

</div>


<div class="metric">

<div class="metric-label">
Model
</div>

<div class="metric-value">

${
model !== null
? model.toFixed(1) + "%"
: "—"
}

</div>

</div>


<div class="metric">

<div class="metric-label">
Edge
</div>

<div class="metric-value">

${
edge !== null
? edge.toFixed(1) + "%"
: "—"
}

</div>

</div>


<div class="metric">

<div class="metric-label">
Expected Move
</div>

<div class="metric-value">

${
move !== null
? move.toFixed(0) + "¢"
: "—"
}

</div>

</div>


<div class="metric">

<div class="metric-label">
Take Profit
</div>

<div class="metric-value">

${
(
Number(
filters.takeProfit ??
0.25
) *
100
).toFixed(0)
}%

</div>

</div>


</div>


<div
style="
margin-top:15px;
font-size:12px;
color:#8d939b;
"
>

<strong>
AUTO-TRADER CHECKS
</strong>

<br><br>

${
diagnostics.checks
.map(
check =>
`

<div
style="
margin-bottom:5px;
"
>

${
check.pass
? "✓"
: "✕"
}

${check.name}:
${check.detail}

</div>

`
)
.join("")
}

</div>


</div>

`;

}


/* =========================================================
LOAD MARKETS
========================================================= */

async function loadMarkets() {

try {

const [
weather,
status
] =
await Promise.all([

api(
"/api/weather"
),

api(
"/api/auto-trade/status"
)

]);


const filters =
status.filters ||
{

minMinutesToClose:
180,

minEdge:
0.10,

minExpectedPriceMove:
0.01,

takeProfit:
Number(
status.takeProfit ??
0.25
)

};


let markets = [];


if (
Array.isArray(
weather
)
) {

markets =
weather;

}

else if (
Array.isArray(
weather.opportunities
)
) {

markets =
weather.opportunities;

}

else if (
Array.isArray(
weather.markets
)
) {

markets =
weather.markets;

}

else if (
Array.isArray(
weather.data
)
) {

markets =
weather.data;

}


$("lastUpdate").textContent =
new Date().toLocaleTimeString();


if (
!markets.length
) {

$("markets").innerHTML = `

<div class="empty">

No today's weather markets
were returned.

</div>

`;

return;

}


$("markets").innerHTML =
markets
.map(
market =>
renderMarket(
market,
filters
)
)
.join("");


}
catch (
error
) {

$("markets").innerHTML = `

<div class="empty">

<strong>
Could not load weather markets.
</strong>

<br><br>

${error.message}

</div>

`;

}

}


/* =========================================================
POSITIONS
========================================================= */

function renderPositions(
entries
) {

if (
!entries ||
!entries.length
) {

$("positions").innerHTML = `

<div class="empty">

No open positions.

</div>

`;

return;

}


$("positions").innerHTML =
entries
.map(
entry =>
`

<div class="position">

<strong>
${entry.city ?? ""}
</strong>

<br>

Ticker:
${entry.ticker ?? "—"}

<br>

Side:
${String(
entry.side ?? ""
).toUpperCase()}

<br>

Contracts:
${entry.contracts ?? "—"}

<br>

Entry:
${
entry.entryPrice != null
? Number(
entry.entryPrice
).toFixed(0) + "¢"
: "—"
}

<br>

Take Profit:
${
entry.targetPrice != null
? Number(
entry.targetPrice
).toFixed(0) + "¢"
: "—"
}

<br>

Cost:
${
entry.cost != null
? "$" +
Number(
entry.cost
).toFixed(2)
: "—"
}

</div>

`
)
.join("");

}


/* =========================================================
REFRESH
========================================================= */

async function refreshAll() {

await loadStatus();

await loadMarkets();

}


/* =========================================================
INITIAL LOAD
========================================================= */

refreshAll();


/*
REFRESH EVERY 10 SECONDS
*/
