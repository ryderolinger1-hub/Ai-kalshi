<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Position Ledger — Kalshi</title>

<script src="https://cdn.jsdelivr.net/npm/jsrsasign@11.1.0/lib/jsrsasign-all-min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: #f4f1ea;
  font-family: Inter, Arial, sans-serif;
}

header {
  padding: 22px 18px;
  border-bottom: 1px solid #292929;
}

h1 {
  margin: 0;
  font-size: 26px;
}

.subtitle {
  color: #858585;
  font-size: 13px;
  margin-top: 5px;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 18px;
}

.panel {
  background: #101010;
  border: 1px solid #292929;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 16px;
}

label {
  display: block;
  color: #999;
  font-size: 12px;
  margin-bottom: 7px;
}

input,
textarea {
  width: 100%;
  background: #080808;
  color: #eee;
  border: 1px solid #333;
  border-radius: 9px;
  padding: 11px;
  font-family: monospace;
  font-size: 13px;
}

textarea {
  min-height: 150px;
  resize: vertical;
}

button {
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  border-radius: 9px;
  border: 1px solid #444;
  background: #181818;
  color: white;
  font-weight: bold;
  font-size: 14px;
}

button:active {
  transform: scale(.98);
}

.status {
  margin-top: 12px;
  padding: 12px;
  border-radius: 9px;
  background: #080808;
  border: 1px solid #292929;
  font-family: monospace;
  font-size: 12px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.card {
  background: #101010;
  border: 1px solid #292929;
  border-radius: 14px;
  padding: 17px;
}

.label2 {
  color: #888;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .08em;
}

.value {
  margin-top: 8px;
  font-size: 25px;
  font-weight: bold;
}

.section {
  margin-top: 20px;
}

.section-title {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 10px;
}

.position {
  background: #101010;
  border: 1px solid #292929;
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 10px;
}

.positionTop {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.ticker {
  font-weight: bold;
  word-break: break-all;
}

.qty {
  font-family: monospace;
}

.details {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 14px;
}

.detail {
  color: #888;
  font-size: 11px;
}

.detail strong {
  display: block;
  color: #eee;
  font-size: 14px;
  margin-top: 4px;
}

.green {
  color: #5de28b !important;
}

.red {
  color: #ff6868 !important;
}

.muted {
  color: #777;
}

.warning {
  color: #e8b45d;
}

@media(max-width:700px) {
  .cards {
    grid-template-columns: 1fr;
  }

  .details {
    grid-template-columns: 1fr 1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>Position Ledger</h1>
  <div class="subtitle">
    Kalshi Portfolio Dashboard
  </div>
</header>

<div class="container">

  <div class="panel">

    <label>Kalshi API Key ID</label>

    <input
      id="apiKeyId"
      value="018ba5a0-f7e4-4ee3-865b-84ec1602d591"
      autocomplete="off"
    >

    <br><br>

    <label>Kalshi Private Key</label>

    <textarea
      id="privateKey"
      placeholder="Paste your complete Kalshi private key here..."
      autocomplete="off"
      spellcheck="false"
    ></textarea>

    <div class="warning" style="margin-top:10px;font-size:11px;">
      Your private key stays in this browser and is not saved by this page.
      Do not put the private key into GitHub.
    </div>

    <button onclick="loadPortfolio()">
      CONNECT TO KALSHI
    </button>

    <div
      id="status"
      class="status"
    >
      Not connected.
    </div>

  </div>


  <div class="cards">

    <div class="card">
      <div class="label2">Cash</div>

      <div
        id="cash"
        class="value"
      >
        —
      </div>
    </div>


    <div class="card">
      <div class="label2">Portfolio Value</div>

      <div
        id="portfolioValue"
        class="value"
      >
        —
      </div>
    </div>


    <div class="card">
      <div class="label2">Total</div>

      <div
        id="total"
        class="value"
      >
        —
      </div>
    </div>

  </div>


  <div class="section">

    <div class="section-title">
      Open Positions
    </div>

    <div id="positions">
      <div class="muted">
        Connect to Kalshi to load positions.
      </div>
    </div>

  </div>

</div>


<script>

const API_BASE =
  "https://api.elections.kalshi.com";

const API_PREFIX =
  "/trade-api/v2";


function setStatus(message) {

  document.getElementById("status").textContent =
    message;

}


function normalizePrivateKey(key) {

  key = key.trim();

  if (!key) {
    throw new Error(
      "Private key box is empty."
    );
  }

  /*
   * Remove accidental surrounding quotes.
   */

  key = key
    .replace(/^"+|"+$/g, "")
    .trim();


  /*
   * Convert literal \\n into real newlines.
   */

  key = key.replace(/\\n/g, "\n");


  /*
   * If the user pasted a normal PEM,
   * leave it alone.
   */

  if (
    key.includes("-----BEGIN PRIVATE KEY-----") ||
    key.includes("-----BEGIN RSA PRIVATE KEY-----")
  ) {
    return key;
  }


  /*
   * If only the base64 body was pasted,
   * rebuild a PKCS8 PEM.
   */

  const body =
    key
      .replace(/\s/g, "");

  return (
    "-----BEGIN PRIVATE KEY-----\n" +
    body.match(/.{1,64}/g).join("\n") +
    "\n-----END PRIVATE KEY-----"
  );
}


function createSigner(privateKeyText) {

  const pem =
    normalizePrivateKey(privateKeyText);

  let key;

  try {

    key = KEYUTIL.getKey(pem);

  } catch (error) {

    throw new Error(
      "Could not read the private key. " +
      "Make sure you pasted the complete PEM private key."
    );

  }


  return function(message) {

    try {

      const sig =
        new KJUR.crypto.Signature({
          alg: "SHA256withRSAandMGF1"
        });

      sig.init(key);

      sig.updateString(message);

      /*
       * jsrsasign uses RSA-PSS here.
       * Kalshi requires SHA-256 PSS.
       */

      const hex =
        sig.sign();

      return hextob64(hex);

    } catch (error) {

      throw new Error(
        "RSA-PSS signing failed: " +
        (
          error?.message ||
          String(error)
        )
      );

    }

  };
}


function buildHeaders(
  method,
  path,
  apiKeyId,
  signer
) {

  const timestamp =
    Date.now().toString();


  /*
   * IMPORTANT:
   *
   * Kalshi signs:
   *
   * timestamp + METHOD + path
   *
   * Query strings are excluded.
   */

  const cleanPath =
    path.split("?")[0];


  const message =
    timestamp +
    method.toUpperCase() +
    cleanPath;


  const signature =
    signer(message);


  return {

    "KALSHI-ACCESS-KEY":
      apiKeyId,

    "KALSHI-ACCESS-TIMESTAMP":
      timestamp,

    "KALSHI-ACCESS-SIGNATURE":
      signature,

    "Accept":
      "application/json"

  };

}


async function kalshiGet(
  path,
  apiKeyId,
  signer
) {

  const headers =
    buildHeaders(
      "GET",
      path,
      apiKeyId,
      signer
    );


  let response;


  try {

    response =
      await fetch(
        API_BASE + path,
        {
          method: "GET",
          headers: headers,
          cache: "no-store"
        }
      );

  } catch (error) {

    /*
     * This is especially useful for
     * diagnosing browser/CORS failures.
     */

    throw new Error(
      "Browser could not connect to Kalshi.\n\n" +
      "Possible CORS/network restriction.\n\n" +
      "Browser error: " +
      (
        error?.message ||
        String(error)
      )
    );

  }


  const text =
    await response.text();


  let data = null;

  try {

    data =
      JSON.parse(text);

  } catch {

    data = {
      raw: text
    };

  }


  if (!response.ok) {

    let details =
      "";

    try {

      details =
        JSON.stringify(
          data,
          null,
          2
        );

    } catch {

      details =
        String(text);

    }


    throw new Error(
      "Kalshi HTTP " +
      response.status +
      "\n\n" +
      details
    );

  }


  return data;

}


function cents(value) {

  if (
    value === null ||
    value === undefined ||
    isNaN(Number(value))
  ) {
    return 0;
  }

  return Number(value);
}


function money(value) {

  return (
    "$" +
    (
      cents(value) / 100
    ).toLocaleString(
      "en-US",
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    )
  );

}


function getPositions(data) {

  if (
    data &&
    Array.isArray(data.market_positions)
  ) {

    return data.market_positions;

  }


  if (
    data &&
    Array.isArray(data.positions)
  ) {

    return data.positions;

  }


  if (
    data &&
    data.data &&
    Array.isArray(data.data.market_positions)
  ) {

    return data.data.market_positions;

  }


  if (
    data &&
    data.data &&
    Array.isArray(data.data.positions)
  ) {

    return data.data.positions;

  }


  return [];

}


function renderPositions(data) {

  const box =
    document.getElementById("positions");


  const positions =
    getPositions(data);


  const active =
    positions.filter(
      p =>
        Number(
          p.position ?? 0
        ) !== 0
    );


  if (!active.length) {

    box.innerHTML =
      '<div class="muted">' +
      'No open positions.' +
      '</div>';

    return;

  }


  box.innerHTML =
    active.map(
      p => {

        const ticker =
          p.ticker ||
          p.market_ticker ||
          "Unknown";


        const position =
          Number(
            p.position ?? 0
          );


        const exposure =
          Number(
            p.market_exposure ??
            p.exposure ??
            0
          );


        const pnl =
          Number(
            p.realized_pnl ??
            p.realizedPnl ??
            0
          );


        const pnlClass =
          pnl > 0
            ? "green"
            : pnl < 0
              ? "red"
              : "";


        return `

          <div class="position">

            <div class="positionTop">

              <div class="ticker">
                ${escapeHtml(ticker)}
              </div>

              <div class="qty">
                ${position > 0 ? "+" : ""}
                ${position}
              </div>

            </div>


            <div class="details">

              <div class="detail">
                Position

                <strong>
                  ${position}
                </strong>
              </div>


              <div class="detail">
                Exposure

                <strong>
                  ${money(exposure)}
                </strong>
              </div>


              <div class="detail">
                Realized P&L

                <strong class="${pnlClass}">
                  ${money(pnl)}
                </strong>
              </div>

            </div>

          </div>

        `;

      }
    ).join("");

}


function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


async function loadPortfolio() {

  const apiKeyId =
    document
      .getElementById("apiKeyId")
      .value
      .trim();


  const privateKey =
    document
      .getElementById("privateKey")
      .value;


  if (!apiKeyId) {

    setStatus(
      "ERROR: API Key ID is empty."
    );

    return;

  }


  if (!privateKey.trim()) {

    setStatus(
      "ERROR: Paste your private key first."
    );

    return;

  }


  setStatus(
    "Preparing RSA-PSS signature..."
  );


  try {

    const signer =
      createSigner(privateKey);


    setStatus(
      "Signing request..."
    );


    const balance =
      await kalshiGet(
        API_PREFIX +
        "/portfolio/balance",
        apiKeyId,
        signer
      );


    setStatus(
      "Balance loaded. Loading positions..."
    );


    const positions =
      await kalshiGet(
        API_PREFIX +
        "/portfolio/positions?limit=200&count_filter=position",
        apiKeyId,
        signer
      );


    /*
     * Balance is returned in cents.
     */

    const cash =
      Number(
        balance.balance ?? 0
      );


    const portfolioValue =
      Number(
        balance.portfolio_value ??
        balance.payout ??
        0
      );


    const total =
      cash +
      portfolioValue;


    document.getElementById("cash")
      .textContent =
      money(cash);


    document.getElementById("portfolioValue")
      .textContent =
      money(portfolioValue);


    document.getElementById("total")
      .textContent =
      money(total);


    renderPositions(
      positions
    );


    setStatus(
      "CONNECTED\n" +
      "Last update: " +
      new Date().toLocaleTimeString()
    );


  } catch (error) {

    console.error(
      "KALSHI DASHBOARD ERROR:",
      error
    );


    setStatus(
      "ERROR\n\n" +
      (
        error?.message ||
        String(error)
      )
    );

  }

}


let autoRefreshStarted = false;


function startAutoRefresh() {

  if (autoRefreshStarted)
    return;

  autoRefreshStarted = true;


  setInterval(
    () => {

      const key =
        document
          .getElementById("privateKey")
          .value
          .trim();


      if (key) {

        loadPortfolio();

      }

    },
    10000
  );

}


startAutoRefresh();

</script>

</body>
</html>
