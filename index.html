<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Position Ledger — Kalshi Dashboard</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #080a0f;
  color: #f5f7fa;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

body {
  min-height: 100vh;
}

.container {
  width: min(1150px, 94%);
  margin: auto;
  padding: 28px 0 60px;
}


/* =========================
   HEADER
========================= */

.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 25px;
}

.title {
  font-size: 28px;
  font-weight: 800;
}

.subtitle {
  margin-top: 5px;
  color: #858d9b;
  font-size: 13px;
}

.live-status {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #39d996;
  font-size: 12px;
  font-weight: 700;
}

.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #39d996;
  box-shadow: 0 0 10px rgba(57,217,150,.7);
}


/* =========================
   ACCOUNT CARDS
========================= */

.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 25px;
}

.card {
  background: #10131a;
  border: 1px solid #202631;
  border-radius: 14px;
}

.stat-card {
  padding: 19px;
  min-height: 115px;
}

.stat-label {
  color: #808896;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .4px;
  margin-bottom: 10px;
}

.stat-value {
  font-size: 24px;
  font-weight: 800;
}

.green {
  color: #39d996 !important;
}

.red {
  color: #ff5969 !important;
}


/* =========================
   PANELS
========================= */

.panel {
  background: #10131a;
  border: 1px solid #202631;
  border-radius: 15px;
  padding: 18px;
  margin-bottom: 18px;
}

.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 15px;
}

.panel-title {
  font-size: 17px;
  font-weight: 800;
}


/* =========================
   PERIOD BUTTONS
========================= */

.periods {
  display: flex;
  gap: 5px;
}

.period-button {
  border: 1px solid #303642;
  background: #171b23;
  color: #89919f;
  border-radius: 8px;
  padding: 7px 13px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

.period-button.active {
  background: #e8edf3;
  color: #080a0f;
  border-color: #e8edf3;
}


/* =========================
   CHART
========================= */

.chart-wrap {
  position: relative;
  width: 100%;
  height: 350px;
  background: #0b0e14;
  border-radius: 11px;
  overflow: hidden;
  touch-action: none;
}

#chart {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: crosshair;
}

.chart-info {
  min-height: 58px;
  margin-top: 11px;
  padding: 11px 13px;
  background: #0b0e14;
  border: 1px solid #202631;
  border-radius: 10px;
  color: #939baa;
  font-size: 12px;
  line-height: 1.5;
}

.chart-info strong {
  color: #f5f7fa;
}

.slider-area {
  margin-top: 13px;
}

#historySlider {
  width: 100%;
  height: 24px;
  accent-color: #f5f7fa;
  cursor: pointer;
  touch-action: none;
}

.slider-labels {
  display: flex;
  justify-content: space-between;
  color: #68717f;
  font-size: 10px;
}

.slider-current {
  text-align: center;
  margin-top: 5px;
  color: #c0c7d1;
  font-size: 11px;
}


/* =========================
   NFL
========================= */

.nfl-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.game-card {
  background: #0b0e14;
  border: 1px solid #202631;
  border-radius: 13px;
  padding: 16px;
}

.game-title {
  font-size: 16px;
  font-weight: 800;
  color: #f5f7fa;
  margin-bottom: 3px;
}

.game-date {
  color: #697281;
  font-size: 11px;
  margin-bottom: 12px;
}

.team-row {
  padding: 12px 0;
  border-top: 1px solid #202631;
}

.team-name {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 8px;
}

.odds-row {
  display: flex;
  gap: 7px;
}

.odds-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex: 1;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 800;
}

.yes-box {
  background: rgba(57,217,150,.09);
  border: 1px solid rgba(57,217,150,.2);
  color: #39d996;
}

.no-box {
  background: rgba(255,89,105,.09);
  border: 1px solid rgba(255,89,105,.2);
  color: #ff5969;
}

.odds-label {
  font-size: 10px;
  opacity: .8;
}

.odds-number {
  font-size: 14px;
}

.loading,
.empty {
  color: #737c8b;
  padding: 20px 0;
  font-size: 13px;
}

.error {
  color: #ff5969;
  background: #181015;
  border: 1px solid #38202a;
  padding: 13px;
  border-radius: 9px;
  font-size: 13px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 850px) {

  .cards {
    grid-template-columns: repeat(2, 1fr);
  }

  .nfl-grid {
    grid-template-columns: 1fr;
  }

}

@media (max-width: 600px) {

  .container {
    width: 93%;
    padding-top: 20px;
  }

  .title {
    font-size: 23px;
  }

  .stat-card {
    min-height: 100px;
    padding: 15px;
  }

  .stat-value {
    font-size: 20px;
  }

  .panel-header {
    flex-direction: column;
    align-items: flex-start;
  }

  .periods {
    width: 100%;
  }

  .period-button {
    flex: 1;
  }

  .chart-wrap {
    height: 300px;
  }

}
</style>
</head>


<body>

<div class="container">


<!-- =========================
     HEADER
========================= -->

<div class="header">

  <div>
    <div class="title">
      Position Ledger
    </div>

    <div class="subtitle">
      Kalshi Trading Dashboard
    </div>
  </div>

  <div class="live-status">
    <span class="live-dot"></span>
    <span id="statusText">LIVE</span>
  </div>

</div>


<!-- =========================
     ACCOUNT
========================= -->

<div class="cards">

  <div class="card stat-card">
    <div class="stat-label">
      Available Balance
    </div>

    <div
      id="balance"
      class="stat-value"
    >
      $0.00
    </div>
  </div>


  <div class="card stat-card">
    <div class="stat-label">
      Portfolio Value
    </div>

    <div
      id="portfolioValue"
      class="stat-value"
    >
      $0.00
    </div>
  </div>


  <div class="card stat-card">
    <div class="stat-label">
      Total Account Value
    </div>

    <div
      id="totalValue"
      class="stat-value"
    >
      $0.00
    </div>
  </div>


  <div class="card stat-card">
    <div class="stat-label">
      Live P/L
    </div>

    <div
      id="livePL"
      class="stat-value"
    >
      $0.00
    </div>
  </div>

</div>


<!-- =========================
     PERFORMANCE
========================= -->

<div class="panel">

  <div class="panel-header">

    <div>

      <div class="panel-title">
        Account Performance
      </div>

      <div
        id="periodDescription"
        class="subtitle"
      >
        Day — 1 minute intervals
      </div>

    </div>


    <div class="periods">

      <button
        class="period-button active"
        data-period="day"
      >
        Day
      </button>

      <button
        class="period-button"
        data-period="week"
      >
        Week
      </button>

      <button
        class="period-button"
        data-period="month"
      >
        Month
      </button>

    </div>

  </div>


  <div
    id="chartWrap"
    class="chart-wrap"
  >

    <canvas id="chart"></canvas>

  </div>


  <div
    id="chartInfo"
    class="chart-info"
  >
    Drag across the graph or use the slider to inspect a timestamp.
  </div>


  <div class="slider-area">

    <input
      id="historySlider"
      type="range"
      min="0"
      max="0"
      value="0"
      step="1"
    >

    <div class="slider-labels">

      <span id="sliderStart">
        --
      </span>

      <span id="sliderEnd">
        --
      </span>

    </div>


    <div
      id="sliderCurrent"
      class="slider-current"
    >
      --
    </div>

  </div>

</div>


<!-- =========================
     NFL
========================= -->

<div class="panel">

  <div class="panel-header">

    <div class="panel-title">
      NFL Markets
    </div>

    <div
      id="nflUpdated"
      class="subtitle"
    >
      Loading...
    </div>

  </div>


  <div
    id="nflGrid"
    class="nfl-grid"
  >

    <div class="loading">
      Loading NFL markets...
    </div>

  </div>

</div>


</div>


<script>


/* =========================================================
   CONFIG
========================================================= */

const WORKER_URL =
  "https://worker1.ryderolinger1.workers.dev";

const HISTORY_KEY =
  "kalshi_pl_history_v1";


/* =========================================================
   PERIOD SETTINGS
========================================================= */

const PERIODS = {

  day: {
    duration:
      24 * 60 * 60 * 1000,

    interval:
      60 * 1000,

    label:
      "Day — 1 minute intervals"
  },

  week: {
    duration:
      7 * 24 * 60 * 60 * 1000,

    interval:
      10 * 60 * 1000,

    label:
      "Week — 10 minute intervals"
  },

  month: {
    duration:
      30 * 24 * 60 * 60 * 1000,

    interval:
      60 * 60 * 1000,

    label:
      "Month — 1 hour intervals"
  }

};


let currentPeriod = "day";

let history = [];

let visibleHistory = [];

let selectedIndex = null;

let currentAccountValue = 0;

let currentPnL = 0;

let dragging = false;


/* =========================================================
   DOM
========================================================= */

const canvas =
  document.getElementById("chart");

const ctx =
  canvas.getContext("2d");

const slider =
  document.getElementById(
    "historySlider"
  );


/* =========================================================
   MONEY
========================================================= */

function money(value) {

  const n =
    Number(value) || 0;

  return n.toLocaleString(
    "en-US",
    {
      style: "currency",
      currency: "USD"
    }
  );

}


/* =========================================================
   HISTORY LOAD
========================================================= */

function loadHistory() {

  try {

    const saved =
      localStorage.getItem(
        HISTORY_KEY
      );

    if (!saved) {

      history = [];

      return;

    }


    const parsed =
      JSON.parse(saved);


    if (!Array.isArray(parsed)) {

      history = [];

      return;

    }


    history =
      parsed
        .filter(point =>
          point &&
          Number.isFinite(
            Number(point.time)
          ) &&
          Number.isFinite(
            Number(point.value)
          )
        )
        .map(point => ({

          time:
            Number(point.time),

          value:
            Number(point.value),

          pnl:
            point.pnl === null ||
            point.pnl === undefined
              ? null
              : Number(point.pnl)

        }))
        .sort(
          (a,b) =>
            a.time - b.time
        );

  } catch {

    history = [];

  }

}


/* =========================================================
   SAVE HISTORY
========================================================= */

let lastSavedTime = 0;

function saveHistoryPoint(
  value,
  pnl
) {

  const now =
    Date.now();


  /*
    Save roughly every 10 seconds.
  */

  if (
    now - lastSavedTime <
    9000
  ) {

    return;

  }


  lastSavedTime =
    now;


  history.push({

    /*
      Absolute timestamp.
      Displayed in local time later.
    */

    time: now,

    value:
      Number(value) || 0,

    pnl:
      Number.isFinite(
        Number(pnl)
      )
        ? Number(pnl)
        : null

  });


  /*
    Keep 31 days.
  */

  const cutoff =
    now -
    31 *
    24 *
    60 *
    60 *
    1000;


  history =
    history.filter(
      point =>
        point.time >= cutoff
    );


  try {

    localStorage.setItem(
      HISTORY_KEY,
      JSON.stringify(history)
    );

  } catch {}

}


/* =========================================================
   TIME FORMATTING
========================================================= */

function dateTime(timestamp) {

  return new Date(
    timestamp
  ).toLocaleString(
    "en-US",
    {
      month: "short",
      day: "numeric",
      year: "numeric",
      hour: "numeric",
      minute: "2-digit",
      second: "2-digit"
    }
  );

}


function graphTime(
  timestamp
) {

  const date =
    new Date(timestamp);


  if (
    currentPeriod === "month"
  ) {

    return date.toLocaleString(
      "en-US",
      {
        month: "short",
        day: "numeric",
        hour: "numeric"
      }
    );

  }


  if (
    currentPeriod === "week"
  ) {

    return date.toLocaleString(
      "en-US",
      {
        weekday: "short",
        hour: "numeric",
        minute: "2-digit"
      }
    );

  }


  return date.toLocaleTimeString(
    "en-US",
    {
      hour: "numeric",
      minute: "2-digit"
    }
  );

}


/* =========================================================
   BUILD GRAPH DATA
========================================================= */

function buildVisibleHistory() {

  const config =
    PERIODS[currentPeriod];


  const now =
    Date.now();


  const start =
    now -
    config.duration;


  const source =
    history
      .filter(
        point =>
          point.time >= start &&
          point.time <= now
      )
      .sort(
        (a,b) =>
          a.time - b.time
      );


  if (!source.length) {

    visibleHistory = [];

    return;

  }


  /*
    Group points into exact intervals:

    Day:
      1 minute

    Week:
      10 minutes

    Month:
      1 hour
  */

  const buckets =
    new Map();


  for (
    const point of source
  ) {

    const bucket =
      Math.floor(
        point.time /
        config.interval
      ) *
      config.interval;


    /*
      Keep the latest value
      inside the bucket.
    */

    buckets.set(
      bucket,
      {
        time: bucket,
        value: point.value,
        pnl: point.pnl
      }
    );

  }


  visibleHistory =
    Array.from(
      buckets.values()
    )
    .sort(
      (a,b) =>
        a.time - b.time
    );

}


/* =========================================================
   RESIZE CANVAS
========================================================= */

function resizeCanvas() {

  const rect =
    canvas.getBoundingClientRect();


  const dpr =
    window.devicePixelRatio ||
    1;


  canvas.width =
    Math.round(
      rect.width * dpr
    );


  canvas.height =
    Math.round(
      rect.height * dpr
    );


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

}


/* =========================================================
   DRAW GRAPH
========================================================= */

function drawChart() {

  resizeCanvas();


  const rect =
    canvas.getBoundingClientRect();


  const width =
    rect.width;

  const height =
    rect.height;


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  if (
    visibleHistory.length < 1
  ) {

    ctx.fillStyle =
      "#737c8b";

    ctx.font =
      "13px Arial";

    ctx.textAlign =
      "center";


    ctx.fillText(
      "Waiting for history...",
      width / 2,
      height / 2
    );


    return;

  }


  const left = 58;
  const right = 20;
  const top = 20;
  const bottom = 42;


  const graphWidth =
    width -
    left -
    right;


  const graphHeight =
    height -
    top -
    bottom;


  const values =
    visibleHistory.map(
      point =>
        Number(point.value)
    );


  let min =
    Math.min(...values);

  let max =
    Math.max(...values);


  if (min === max) {

    min -= 1;
    max += 1;

  }


  const padding =
    (max - min) *
    0.12;


  min -= padding;
  max += padding;


  function x(index) {

    if (
      visibleHistory.length === 1
    ) {

      return left +
        graphWidth / 2;

    }


    return left +
      (
        index /
        (
          visibleHistory.length - 1
        )
      ) *
      graphWidth;

  }


  function y(value) {

    return top +
      (
        1 -
        (
          (value - min) /
          (max - min)
        )
      ) *
      graphHeight;

  }


  /*
    Horizontal grid.
  */

  ctx.strokeStyle =
    "#202631";

  ctx.lineWidth = 1;


  for (
    let i = 0;
    i <= 4;
    i++
  ) {

    const yy =
      top +
      (
        i / 4
      ) *
      graphHeight;


    ctx.beginPath();

    ctx.moveTo(
      left,
      yy
    );

    ctx.lineTo(
      width - right,
      yy
    );

    ctx.stroke();


    const label =
      max -
      (
        i / 4
      ) *
      (
        max - min
      );


    ctx.fillStyle =
      "#697281";

    ctx.font =
      "10px Arial";

    ctx.textAlign =
      "right";


    ctx.fillText(
      money(label),
      left - 8,
      yy + 3
    );

  }


  /*
    Main line.
  */

  ctx.beginPath();


  visibleHistory.forEach(
    (point,index) => {

      const xx =
        x(index);

      const yy =
        y(point.value);


      if (index === 0) {

        ctx.moveTo(
          xx,
          yy
        );

      } else {

        ctx.lineTo(
          xx,
          yy
        );

      }

    }
  );


  ctx.strokeStyle =
    "#e8edf3";

  ctx.lineWidth =
    2.2;

  ctx.lineJoin =
    "round";

  ctx.lineCap =
    "round";

  ctx.stroke();


  /*
    Selected point.
  */

  if (
    selectedIndex !== null &&
    visibleHistory[selectedIndex]
  ) {

    const point =
      visibleHistory[
        selectedIndex
      ];


    const xx =
      x(selectedIndex);

    const yy =
      y(point.value);


    /*
      ONE vertical line.
    */

    ctx.beginPath();

    ctx.setLineDash([
      4,
      5
    ]);

    ctx.moveTo(
      xx,
      top
    );

    ctx.lineTo(
      xx,
      height - bottom
    );

    ctx.strokeStyle =
      "#78818f";

    ctx.lineWidth =
      1;

    ctx.stroke();

    ctx.setLineDash([]);


    /*
      Selected dot.
    */

    ctx.beginPath();

    ctx.arc(
      xx,
      yy,
      5,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "#ffffff";

    ctx.fill();

  }


  /*
    Time labels.
  */

  const count =
    visibleHistory.length;


  if (count > 0) {

    const indexes = [];


    if (count <= 5) {

      for (
        let i = 0;
        i < count;
        i++
      ) {

        indexes.push(i);

      }

    } else {

      indexes.push(0);

      indexes.push(
        Math.floor(
          (count - 1) * .25
        )
      );

      indexes.push(
        Math.floor(
          (count - 1) * .5
        )
      );

      indexes.push(
        Math.floor(
          (count - 1) * .75
        )
      );

      indexes.push(
        count - 1
      );

    }


    ctx.fillStyle =
      "#697281";

    ctx.font =
      "10px Arial";

    ctx.textAlign =
      "center";


    indexes.forEach(
      index => {

        const point =
          visibleHistory[index];


        ctx.fillText(
          graphTime(point.time),
          x(index),
          height - 13
        );

      }
    );

  }

}


/* =========================================================
   UPDATE SLIDER
========================================================= */

function updateSlider() {

  if (
    !visibleHistory.length
  ) {

    slider.max = 0;
    slider.value = 0;

    document.getElementById(
      "sliderStart"
    ).textContent = "--";

    document.getElementById(
      "sliderEnd"
    ).textContent = "--";

    document.getElementById(
      "sliderCurrent"
    ).textContent = "--";

    return;

  }


  slider.max =
    visibleHistory.length - 1;


  if (
    selectedIndex === null
  ) {

    selectedIndex =
      visibleHistory.length - 1;

  }


  selectedIndex =
    Math.max(
      0,
      Math.min(
        selectedIndex,
        visibleHistory.length - 1
      )
    );


  slider.value =
    selectedIndex;


  document.getElementById(
    "sliderStart"
  ).textContent =
    graphTime(
      visibleHistory[0].time
    );


  document.getElementById(
    "sliderEnd"
  ).textContent =
    graphTime(
      visibleHistory[
        visibleHistory.length - 1
      ].time
    );


  document.getElementById(
    "sliderCurrent"
  ).textContent =
    dateTime(
      visibleHistory[
        selectedIndex
      ].time
    );

}


/* =========================================================
   INSPECT GRAPH
========================================================= */

function inspectIndex(index) {

  if (
    !visibleHistory.length
  ) {

    return;

  }


  selectedIndex =
    Math.max(
      0,
      Math.min(
        visibleHistory.length - 1,
        Math.round(index)
      )
    );


  drawChart();

  updateSlider();


  const point =
    visibleHistory[
      selectedIndex
    ];


  const pnl =
    point.pnl;


  document.getElementById(
    "chartInfo"
  ).innerHTML = `

    <strong>
      ${dateTime(point.time)}
    </strong>

    &nbsp; • &nbsp;

    Account Value:
    <strong>
      ${money(point.value)}
    </strong>

    &nbsp; • &nbsp;

    P/L:

    ${
      pnl === null
        ? `<strong>P/L not recorded</strong>`
        : `
          <strong class="${pnl >= 0 ? "green" : "red"}">
            ${pnl >= 0 ? "+" : ""}
            ${money(pnl)}
          </strong>
        `
    }

  `;

}


/* =========================================================
   POINTER → GRAPH INDEX
========================================================= */

function pointerToIndex(
  event
) {

  if (
    visibleHistory.length < 2
  ) {

    return 0;

  }


  const rect =
    canvas.getBoundingClientRect();


  const left = 58;
  const right = 20;


  let position =
    event.clientX -
    rect.left;


  position =
    Math.max(
      left,
      Math.min(
        rect.width - right,
        position
      )
    );


  const ratio =
    (
      position - left
    ) /
    (
      rect.width -
      left -
      right
    );


  return ratio *
    (
      visibleHistory.length - 1
    );

}


/* =========================================================
   GRAPH DRAG
========================================================= */

canvas.addEventListener(
  "pointerdown",
  event => {

    if (
      !visibleHistory.length
    ) {

      return;

    }


    dragging = true;


    canvas.setPointerCapture(
      event.pointerId
    );


    inspectIndex(
      pointerToIndex(event)
    );

  }
);


canvas.addEventListener(
  "pointermove",
  event => {

    if (!dragging) {
      return;
    }


    inspectIndex(
      pointerToIndex(event)
    );

  }
);


canvas.addEventListener(
  "pointerup",
  () => {

    dragging = false;

  }
);


canvas.addEventListener(
  "pointercancel",
  () => {

    dragging = false;

  }
);

/* =========================================================
   PORTFOLIO
========================================================= */

async function loadPortfolio() {

  try {

    const response =
      await fetch(
        WORKER_URL +
        "/api/portfolio?t=" +
        Date.now(),
        {
          cache: "no-store"
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        "Portfolio request failed"
      );

    }


    const balanceRaw =
      Number(
        data.balance?.balance ??
        data.balance?.available_balance ??
        0
      );


    const balance =
      balanceRaw / 100;


    const positions =
      Array.isArray(
        data.positions?.market_positions
      )
        ? data.positions.market_positions
        : Array.isArray(
            data.positions?.positions
          )
          ? data.positions.positions
          : [];


    let portfolioValue = 0;


    for (
      const position of positions
    ) {

      const marketValue =
        Number(
          position.market_value ??
          position.market_value_cents ??
          0
        );


      if (
        Number.isFinite(
          marketValue
        )
      ) {

        portfolioValue +=
          marketValue / 100;

      }

    }


    if (
      Number.isFinite(
        Number(
          data.positions?.market_value
        )
      )
    ) {

      portfolioValue =
        Number(
          data.positions.market_value
        ) / 100;

    }


    const total =
      balance +
      portfolioValue;


    /*
      Try to get an actual P/L field.
    */

    let pnl = null;


    const pnlCandidates = [

      data.positions?.total_pnl,

      data.positions?.pnl,

      data.positions?.profit_loss,

      data.balance?.pnl

    ];


    for (
      const candidate
      of pnlCandidates
    ) {

      if (
        candidate !== undefined &&
        candidate !== null &&
        Number.isFinite(
          Number(candidate)
        )
      ) {

        pnl =
          Number(candidate);


        if (
          Math.abs(pnl) > 10000
        ) {

          pnl /= 100;

        }


        break;

      }

    }


    /*
      Fallback to change from first
      recorded account value.
    */

    if (pnl === null) {

      if (history.length) {

        pnl =
          total -
          history[0].value;

      } else {

        pnl = 0;

      }

    }


    currentAccountValue =
      total;

    currentPnL =
      pnl;


    document.getElementById(
      "balance"
    ).textContent =
      money(balance);


    document.getElementById(
      "portfolioValue"
    ).textContent =
      money(portfolioValue);


    document.getElementById(
      "totalValue"
    ).textContent =
      money(total);


    const pnlElement =
      document.getElementById(
        "livePL"
      );


    pnlElement.textContent =
      (
        pnl >= 0
          ? "+"
          : ""
      ) +
      money(pnl);


    pnlElement.classList.remove(
      "green",
      "red"
    );


    pnlElement.classList.add(
      pnl >= 0
        ? "green"
        : "red"
    );


    saveHistoryPoint(
      total,
      pnl
    );


    refreshChart();


    document.getElementById(
      "statusText"
    ).textContent =
      "LIVE • " +
      new Date().toLocaleTimeString(
        "en-US",
        {
          hour: "numeric",
          minute: "2-digit"
        }
      );

  } catch (error) {

    console.error(
      "Portfolio error:",
      error
    );


    document.getElementById(
      "statusText"
    ).textContent =
      "CONNECTION ERROR";

  }

}


/* =========================================================
   NFL PRICE PARSER
========================================================= */

function percent(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return null;

  }


  let n =
    Number(
      String(value)
        .replace("$", "")
        .replace("%", "")
        .trim()
    );


  if (
    !Number.isFinite(n)
  ) {

    return null;

  }


  /*
    0.62 -> 62%
    62   -> 62%
  */

  if (
    n >= 0 &&
    n <= 1
  ) {

    n *= 100;

  }


  return Math.max(
    0,
    Math.min(
      100,
      n
    )
  );

}


/* =========================================================
   NFL ODDS
========================================================= */

function getOdds(market) {

  let yes = null;


  /*
    Last traded price first.
  */

  const lastCandidates = [

    market.last_price_dollars,

    market.last_price,

    market.yes_last_price_dollars,

    market.yes_last_price,

    market.last_trade_price_dollars,

    market.last_trade_price

  ];


  for (
    const candidate
    of lastCandidates
  ) {

    yes =
      percent(candidate);


    if (
      yes !== null
    ) {

      break;

    }

  }


  /*
    If no last price, calculate midpoint.
  */

  if (
    yes === null
  ) {

    const bid =
      percent(
        market.yes_bid_dollars ??
        market.yes_bid ??
        market.yes_bid_price
      );


    const ask =
      percent(
        market.yes_ask_dollars ??
        market.yes_ask ??
        market.yes_ask_price
      );


    if (
      bid !== null &&
      ask !== null
    ) {

      yes =
        (bid + ask) / 2;

    } else if (
      ask !== null
    ) {

      yes = ask;

    } else if (
      bid !== null
    ) {

      yes = bid;

    }

  }


  /*
    Older fields.
  */

  if (
    yes === null
  ) {

    const candidates = [

      market.yes_price,

      market.yes_price_dollars,

      market.price

    ];


    for (
      const candidate
      of candidates
    ) {

      yes =
        percent(candidate);


      if (
        yes !== null
      ) {

        break;

      }

    }

  }


  let no =
    percent(
      market.no_price_dollars ??
      market.no_price ??
      market.no_last_price_dollars ??
      market.no_last_price
    );


  /*
    Binary market:
    NO = 100 - YES
  */

  if (
    no === null &&
    yes !== null
  ) {

    no =
      100 - yes;

  }


  return {
    yes,
    no
  };

}


/* =========================================================
   NFL TEAM NAME
========================================================= */

function cleanTeamName(name) {

  if (!name) {
    return "";
  }


  let value =
    String(name)
      .trim();


  /*
    Remove common Kalshi prefixes.
  */

  value =
    value
      .replace(
        /^YES\s+/i,
        ""
      )
      .replace(
        /^NO\s+/i,
        ""
      )
      .trim();


  return value;

}


/*
  Team abbreviations → full names.

  This is also used when Kalshi gives
  abbreviations in the ticker.
*/

const NFL_TEAMS = {

  ARI: "Arizona Cardinals",
  ATL: "Atlanta Falcons",
  BAL: "Baltimore Ravens",
  BUF: "Buffalo Bills",
  CAR: "Carolina Panthers",
  CHI: "Chicago Bears",
  CIN: "Cincinnati Bengals",
  CLE: "Cleveland Browns",
  DAL: "Dallas Cowboys",
  DEN: "Denver Broncos",
  DET: "Detroit Lions",
  GB: "Green Bay Packers",
  GNB: "Green Bay Packers",
  HOU: "Houston Texans",
  IND: "Indianapolis Colts",
  JAX: "Jacksonville Jaguars",
  KC: "Kansas City Chiefs",
  KAN: "Kansas City Chiefs",
  LAC: "Los Angeles Chargers",
  LA: "Los Angeles Rams",
  LAR: "Los Angeles Rams",
  LV: "Las Vegas Raiders",
  MIA: "Miami Dolphins",
  MIN: "Minnesota Vikings",
  NE: "New England Patriots",
  NO: "New Orleans Saints",
  NYG: "New York Giants",
  NYJ: "New York Jets",
  PHI: "Philadelphia Eagles",
  PIT: "Pittsburgh Steelers",
  SEA: "Seattle Seahawks",
  SF: "San Francisco 49ers",
  SFO: "San Francisco 49ers",
  TB: "Tampa Bay Buccaneers",
  TEN: "Tennessee Titans",
  WAS: "Washington Commanders"

};


/* =========================================================
   FIND TEAM NAME
========================================================= */

function getTeamName(market) {

  /*
    Prefer explicit Kalshi team fields.
  */

  const directCandidates = [

    market.yes_sub_title,

    market.yes_title,

    market.subtitle,

    market.team_name,

    market.team,

    market.name

  ];


  for (
    const candidate
    of directCandidates
  ) {

    if (
      candidate &&
      String(candidate).trim()
    ) {

      const cleaned =
        cleanTeamName(candidate);


      /*
        If the value is an abbreviation,
        expand it.
      */

      const upper =
        cleaned
          .toUpperCase()
          .replace(/[^A-Z]/g, "");


      if (
        NFL_TEAMS[upper]
      ) {

        return NFL_TEAMS[upper];

      }


      return cleaned;

    }

  }


  /*
    Try ticker.

    Example:

      KXNFLGAME-20250921-ARI-SEA-ARI

  */

  const ticker =
    String(
      market.ticker || ""
    );


  const parts =
    ticker
      .split("-");


  for (
    let i = parts.length - 1;
    i >= 0;
    i--
  ) {

    const code =
      parts[i]
        .toUpperCase();


    if (
      NFL_TEAMS[code]
    ) {

      return NFL_TEAMS[code];

    }

  }


  /*
    Last fallback.
  */

  return cleanTeamName(
    market.ticker ||
    "Team"
  );

}


/* =========================================================
   GAME KEY
========================================================= */

function getGameKey(market) {

  /*
    Kalshi's event_ticker is the best
    grouping identifier.
  */

  if (
    market.event_ticker
  ) {

    return String(
      market.event_ticker
    );

  }


  if (
    market.event_id
  ) {

    return String(
      market.event_id
    );

  }


  if (
    market.event
  ) {

    return String(
      market.event
    );

  }


  /*
    Fallback to ticker without
    the final outcome portion.
  */

  const ticker =
    String(
      market.ticker || ""
    );


  const parts =
    ticker.split("-");


  return parts
    .slice(
      0,
      Math.max(
        1,
        parts.length - 1
      )
    )
    .join("-");

}


/* =========================================================
   GAME TITLE
========================================================= */

function getGameTitle(
  markets
) {

  const teams = [];


  for (
    const market
    of markets
  ) {

    const name =
      getTeamName(market);


    if (
      name &&
      !teams.includes(name)
    ) {

      teams.push(name);

    }

  }


  /*
    Exactly two teams:
      Team A vs Team B
  */

  if (
    teams.length >= 2
  ) {

    return (
      teams[0] +
      " vs. " +
      teams[1]
    );

  }


  if (
    teams.length === 1
  ) {

    return teams[0];

  }


  return "NFL Game";

}


/* =========================================================
   NFL DATE
========================================================= */

function getGameDate(
  markets
) {

  for (
    const market
    of markets
  ) {

    const possible = [

      market.expected_expiration_time,

      market.close_time,

      market.expiration_time,

      market.end_time

    ];


    for (
      const value
      of possible
    ) {

      if (!value) {
        continue;
      }


      const date =
        new Date(value);


      if (
        !Number.isNaN(
          date.getTime()
        )
      ) {

        return date.toLocaleString(
          "en-US",
          {
            weekday: "short",
            month: "short",
            day: "numeric",
            hour: "numeric",
            minute: "2-digit"
          }
        );

      }

    }

  }


  return "";

}


/* =========================================================
   NFL LOAD
========================================================= */

async function loadNFL() {

  const grid =
    document.getElementById(
      "nflGrid"
    );


  try {

    const response =
      await fetch(
        WORKER_URL +
        "/api/nfl?t=" +
        Date.now(),
        {
          cache: "no-store"
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        "NFL feed error"
      );

    }


    const markets =
      Array.isArray(
        data.markets
      )
        ? data.markets
        : [];


    if (!markets.length) {

      grid.innerHTML =
        `
        <div class="empty">
          No open NFL markets found.
        </div>
        `;

      return;

    }


    /*
      Group all markets by game.
    */

    const games =
      new Map();


    for (
      const market
      of markets
    ) {

      const key =
        getGameKey(market);


      if (
        !games.has(key)
      ) {

        games.set(
          key,
          []
        );

      }


      games
        .get(key)
        .push(market);

    }


    grid.innerHTML = "";


    /*
      Display every game.
    */

    for (
      const [
        gameKey,
        gameMarkets
      ]
      of games
    ) {

      const gameCard =
        document.createElement(
          "div"
        );


      gameCard.className =
        "game-card";


      const title =
        document.createElement(
          "div"
        );


      title.className =
        "game-title";


      title.textContent =
        getGameTitle(
          gameMarkets
        );


      gameCard.appendChild(
        title
      );


      const date =
        getGameDate(
          gameMarkets
        );


      if (date) {

        const dateElement =
          document.createElement(
            "div"
          );


        dateElement.className =
          "game-date";


        dateElement.textContent =
          date;


        gameCard.appendChild(
          dateElement
        );

      }


      /*
        Prevent duplicate team rows.
      */

      const teamsShown =
        new Set();


      for (
        const market
        of gameMarkets
      ) {

        const team =
          getTeamName(market);


        if (
          teamsShown.has(team)
        ) {

          continue;

        }


        teamsShown.add(team);


        const odds =
          getOdds(market);


        const teamRow =
          document.createElement(
            "div"
          );


        teamRow.className =
          "team-row";


        const teamName =
          document.createElement(
            "div"
          );


        teamName.className =
          "team-name";


        teamName.textContent =
          team;


        teamRow.appendChild(
          teamName
        );


        const oddsRow =
          document.createElement(
            "div"
          );


        oddsRow.className =
          "odds-row";


        /*
          YES
        */

        const yesBox =
          document.createElement(
            "div"
          );


        yesBox.className =
          "odds-box yes-box";


        yesBox.innerHTML = `

          <span class="odds-label">
            YES
          </span>

          <span class="odds-number">
            ${
              odds.yes === null
                ? "--"
                : odds.yes.toFixed(1) + "%"
            }
          </span>

        `;


        /*
          NO
        */

        const noBox =
          document.createElement(
            "div"
          );


        noBox.className =
          "odds-box no-box";


        noBox.innerHTML = `

          <span class="odds-label">
            NO
          </span>

          <span class="odds-number">
            ${
              odds.no === null
                ? "--"
                : odds.no.toFixed(1) + "%"
            }
          </span>

        `;


        oddsRow.appendChild(
          yesBox
        );

        oddsRow.appendChild(
          noBox
        );


        teamRow.appendChild(
          oddsRow
        );


        gameCard.appendChild(
          teamRow
        );

      }


      grid.appendChild(
        gameCard
      );

    }


    document.getElementById(
      "nflUpdated"
    ).textContent =
      "Updated " +
      new Date().toLocaleTimeString(
        "en-US",
        {
          hour: "numeric",
          minute: "2-digit"
        }
      );

  } catch (error) {

    console.error(
      error
    );


    grid.innerHTML =
      `
      <div class="error">
        NFL feed error
      </div>
      `;

  }

}
