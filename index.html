<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Position Ledger — Kalshi Dashboard</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

:root {
    --bg: #08090b;
    --panel: #101216;
    --panel2: #15171c;
    --border: #252830;
    --text: #f2f2f0;
    --muted: #858993;
    --green: #53d769;
    --red: #ff5c67;
    --yellow: #f4c95d;
    --blue: #6ea8fe;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at top right, rgba(90,100,130,.12), transparent 35%),
        var(--bg);
    color: var(--text);
    font-family: Inter, sans-serif;
    min-height: 100vh;
}

.container {
    width: min(1200px, calc(100% - 28px));
    margin: 0 auto;
    padding: 28px 0 50px;
}

/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
    margin-bottom: 28px;
}

.title {
    margin: 0;
    font-family: Fraunces, serif;
    font-size: clamp(32px, 7vw, 58px);
    line-height: .95;
    letter-spacing: -2px;
}

.subtitle {
    color: var(--muted);
    margin-top: 10px;
    font-size: 13px;
    font-family: "IBM Plex Mono", monospace;
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 12px;
    font-family: "IBM Plex Mono", monospace;
}

.status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 12px rgba(83,215,105,.7);
}

.status-dot.error {
    background: var(--red);
    box-shadow: 0 0 12px rgba(255,92,103,.6);
}

/* BUTTON */

button {
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    border-radius: 9px;
    padding: 10px 14px;
    cursor: pointer;
    font-weight: 600;
    transition: .15s ease;
}

button:hover {
    border-color: #454a55;
    background: #1b1e24;
}

button:active {
    transform: scale(.98);
}

.refresh-button {
    font-family: "IBM Plex Mono", monospace;
}

/* CARDS */

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 14px;
}

.card {
    background: linear-gradient(145deg, var(--panel2), var(--panel));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    min-height: 125px;
}

.card-label {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.3px;
    font-family: "IBM Plex Mono", monospace;
}

.card-value {
    margin-top: 17px;
    font-family: "IBM Plex Mono", monospace;
    font-size: clamp(23px, 4vw, 34px);
    font-weight: 600;
    letter-spacing: -1px;
}

.card-value.green {
    color: var(--green);
}

.card-value.red {
    color: var(--red);
}

/* MAIN PANEL */

.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    margin-top: 14px;
}

.panel-header {
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    border-bottom: 1px solid var(--border);
}

.panel-title {
    font-family: Fraunces, serif;
    font-size: 22px;
}

.panel-meta {
    color: var(--muted);
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
}

/* TABLE */

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 720px;
}

th {
    text-align: left;
    padding: 12px 18px;
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-family: "IBM Plex Mono", monospace;
    font-weight: 500;
    border-bottom: 1px solid var(--border);
}

td {
    padding: 15px 18px;
    border-bottom: 1px solid #1c1e23;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
}

tr:last-child td {
    border-bottom: 0;
}

.market {
    font-family: Inter, sans-serif;
    font-weight: 600;
    color: var(--text);
}

.ticker {
    display: block;
    color: var(--muted);
    font-size: 10px;
    margin-top: 4px;
}

.yes {
    color: var(--green);
}

.no {
    color: var(--red);
}

.empty {
    padding: 45px 20px;
    text-align: center;
    color: var(--muted);
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
}

/* ERROR */

.error-box {
    display: none;
    background: rgba(255,92,103,.08);
    border: 1px solid rgba(255,92,103,.3);
    color: #ff9da5;
    border-radius: 12px;
    padding: 15px;
    margin-top: 14px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
}

/* FOOTER */

.footer {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    color: var(--muted);
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    margin-top: 16px;
}

/* MOBILE */

@media (max-width: 850px) {
    .cards {
        grid-template-columns: repeat(2, 1fr);
    }

    .header {
        align-items: flex-start;
        flex-direction: column;
    }
}

@media (max-width: 500px) {
    .container {
        width: min(100% - 18px, 1200px);
        padding-top: 20px;
    }

    .cards {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .card {
        min-height: 110px;
        padding: 14px;
    }

    .card-value {
        margin-top: 13px;
        font-size: 22px;
    }

    .panel-header {
        padding: 15px;
    }
}
</style>
</head>

<body>

<div class="container">

    <header class="header">

        <div>
            <h1 class="title">Position Ledger</h1>
            <div class="subtitle">
                KALSHI PORTFOLIO DASHBOARD
            </div>
        </div>

        <div>
            <div class="status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">CONNECTING</span>
            </div>

            <button
                class="refresh-button"
                onclick="loadPortfolio()"
                style="margin-top:10px;"
            >
                ↻ Refresh
            </button>
        </div>

    </header>


    <!-- SUMMARY CARDS -->

    <section class="cards">

        <div class="card">
            <div class="card-label">Available Balance</div>
            <div class="card-value" id="balance">$0.00</div>
        </div>

        <div class="card">
            <div class="card-label">Portfolio Value</div>
            <div class="card-value" id="portfolioValue">$0.00</div>
        </div>

        <div class="card">
            <div class="card-label">Total Account Value</div>
            <div class="card-value green" id="totalValue">$0.00</div>
        </div>

        <div class="card">
            <div class="card-label">Open Positions</div>
            <div class="card-value" id="positionCount">0</div>
        </div>

    </section>


    <!-- ERROR -->

    <div class="error-box" id="errorBox"></div>


    <!-- POSITIONS -->

    <section class="panel">

        <div class="panel-header">

            <div class="panel-title">
                Open Positions
            </div>

            <div class="panel-meta" id="updated">
                Waiting for data...
            </div>

        </div>

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>
                        <th>Market</th>
                        <th>Side</th>
                        <th>Contracts</th>
                        <th>Avg Price</th>
                        <th>Market Value</th>
                        <th>P/L</th>
                    </tr>

                </thead>

                <tbody id="positionsBody">

                    <tr>
                        <td colspan="6" class="empty">
                            Loading portfolio...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </section>


    <div class="footer">
        <span>CONNECTED THROUGH CLOUDFLARE WORKER</span>
        <span id="lastRefresh">—</span>
    </div>

</div>


<script>

/*
==========================================================
 KALSHI WORKER
==========================================================
*/

const WORKER_URL =
    "https://worker1.ryderolinger1.workers.dev/api/portfolio";


/*
==========================================================
 HELPERS
==========================================================
*/

function money(value) {

    const number = Number(value);

    if (!Number.isFinite(number)) {
        return "$0.00";
    }

    return number.toLocaleString("en-US", {
        style: "currency",
        currency: "USD",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}


function number(value) {

    const n = Number(value);

    if (!Number.isFinite(n)) {
        return 0;
    }

    return n;
}


function getPositions(data) {

    const positions =
        data?.positions?.market_positions;

    if (Array.isArray(positions)) {
        return positions;
    }

    return [];
}


/*
==========================================================
 BALANCE
==========================================================
*/

function getBalance(data) {

    const balanceData = data?.balance;

    if (!balanceData) {
        return 0;
    }

    /*
        Kalshi returns balance_dollars in the
        portfolio balance response.
    */

    if (balanceData.balance_dollars !== undefined) {
        return Number(balanceData.balance_dollars) || 0;
    }

    /*
        Fallback if the API returns balance in cents.
    */

    if (balanceData.balance !== undefined) {

        const raw = Number(balanceData.balance);

        if (Number.isFinite(raw)) {

            /*
                Very large values are usually cents.
            */

            if (Math.abs(raw) > 1000) {
                return raw / 100;
            }

            return raw;
        }
    }

    return 0;
}


/*
==========================================================
 PORTFOLIO VALUE
==========================================================
*/

function getPortfolioValue(data) {

    const positions = data?.positions;

    if (!positions) {
        return 0;
    }

    if (positions.portfolio_value !== undefined) {

        const value = Number(
            positions.portfolio_value
        );

        if (Number.isFinite(value)) {
            return value;
        }
    }

    return 0;
}


/*
==========================================================
 MARKET NAME
==========================================================
*/

function getMarketName(position) {

    return (
        position.market_title ||
        position.title ||
        position.market_name ||
        position.ticker ||
        position.market_ticker ||
        "Unknown Market"
    );
}


function getTicker(position) {

    return (
        position.ticker ||
        position.market_ticker ||
        position.market_id ||
        ""
    );
}


/*
==========================================================
 SIDE
==========================================================
*/

function getSide(position) {

    if (
        position.position !== undefined
    ) {
        return String(position.position).toUpperCase();
    }

    if (
        position.side !== undefined
    ) {
        return String(position.side).toUpperCase();
    }

    if (
        position.yes !== undefined
    ) {
        return "YES";
    }

    return "—";
}


/*
==========================================================
 CONTRACT COUNT
==========================================================
*/

function getContracts(position) {

    const candidates = [

        position.total_contracts,

        position.contracts,

        position.position,

        position.quantity,

        position.count

    ];

    for (const candidate of candidates) {

        if (
            typeof candidate === "number" &&
            Number.isFinite(candidate)
        ) {
            return Math.abs(candidate);
        }

        if (
            typeof candidate === "string" &&
            candidate.trim() !== "" &&
            !isNaN(Number(candidate))
        ) {
            return Math.abs(Number(candidate));
        }
    }

    return 0;
}


/*
==========================================================
 PRICE
==========================================================
*/

function getAveragePrice(position) {

    const candidates = [

        position.average_price,

        position.avg_price,

        position.average_entry_price,

        position.avg_entry_price,

        position.entry_price

    ];

    for (const candidate of candidates) {

        if (
            candidate !== undefined &&
            candidate !== null &&
            candidate !== ""
        ) {

            const value = Number(candidate);

            if (Number.isFinite(value)) {

                /*
                    Kalshi prices may be represented
                    as cents or dollars depending on
                    endpoint/version.
                */

                if (value > 1) {
                    return value / 100;
                }

                return value;
            }
        }
    }

    return null;
}


/*
==========================================================
 MARKET VALUE
==========================================================
*/

function getMarketValue(position) {

    const candidates = [

        position.market_value,

        position.market_value_dollars,

        position.value,

        position.current_value

    ];

    for (const candidate of candidates) {

        if (
            candidate !== undefined &&
            candidate !== null &&
            candidate !== ""
        ) {

            const value = Number(candidate);

            if (Number.isFinite(value)) {

                /*
                    Large values are likely cents.
                */

                if (Math.abs(value) > 1000) {
                    return value / 100;
                }

                return value;
            }
        }
    }

    return null;
}


/*
==========================================================
 P/L
==========================================================
*/

function getPnL(position) {

    const candidates = [

        position.realized_pnl,

        position.unrealized_pnl,

        position.pnl,

        position.profit_loss,

        position.profit

    ];

    for (const candidate of candidates) {

        if (
            candidate !== undefined &&
            candidate !== null &&
            candidate !== ""
        ) {

            const value = Number(candidate);

            if (Number.isFinite(value)) {

                if (Math.abs(value) > 1000) {
                    return value / 100;
                }

                return value;
            }
        }
    }

    return null;
}


/*
==========================================================
 RENDER POSITIONS
==========================================================
*/

function renderPositions(positions) {

    const body =
        document.getElementById("positionsBody");

    if (!positions.length) {

        body.innerHTML = `
            <tr>
                <td colspan="6" class="empty">
                    No open positions
                </td>
            </tr>
        `;

        return;
    }


    body.innerHTML = positions.map(position => {

        const market =
            getMarketName(position);

        const ticker =
            getTicker(position);

        const side =
            getSide(position);

        const contracts =
            getContracts(position);

        const avg =
            getAveragePrice(position);

        const value =
            getMarketValue(position);

        const pnl =
            getPnL(position);


        const sideClass =
            side === "YES"
                ? "yes"
                : side === "NO"
                    ? "no"
                    : "";


        let pnlHTML = "—";

        if (pnl !== null) {

            const pnlClass =
                pnl >= 0
                    ? "yes"
                    : "no";

            const sign =
                pnl >= 0
                    ? "+"
                    : "";

            pnlHTML = `
                <span class="${pnlClass}">
                    ${sign}${money(pnl)}
                </span>
            `;
        }


        return `

            <tr>

                <td>

                    <div class="market">
                        ${escapeHTML(market)}
                    </div>

                    <span class="ticker">
                        ${escapeHTML(ticker)}
                    </span>

                </td>

                <td>
                    <strong class="${sideClass}">
                        ${escapeHTML(side)}
                    </strong>
                </td>

                <td>
                    ${contracts.toLocaleString()}
                </td>

                <td>
                    ${
                        avg === null
                            ? "—"
                            : money(avg)
                    }
                </td>

                <td>
                    ${
                        value === null
                            ? "—"
                            : money(value)
                    }
                </td>

                <td>
                    ${pnlHTML}
                </td>

            </tr>

        `;

    }).join("");
}


/*
==========================================================
 HTML ESCAPE
==========================================================
*/

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/*
==========================================================
 LOAD PORTFOLIO
==========================================================
*/

async function loadPortfolio() {

    const statusText =
        document.getElementById("statusText");

    const statusDot =
        document.getElementById("statusDot");

    const errorBox =
        document.getElementById("errorBox");

    const positionsBody =
        document.getElementById("positionsBody");


    statusText.textContent =
        "UPDATING";

    statusDot.classList.remove("error");

    errorBox.style.display =
        "none";


    try {

        const response =
            await fetch(
                WORKER_URL + "?t=" + Date.now(),
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            const text =
                await response.text();

            throw new Error(
                "Worker returned HTTP " +
                response.status +
                "\n\n" +
                text
            );
        }


        const data =
            await response.json();


        if (!data.ok) {

            throw new Error(
                JSON.stringify(
                    data,
                    null,
                    2
                )
            );
        }


        /*
        -----------------------------
        BALANCE
        -----------------------------
        */

        const balance =
            getBalance(data);


        document.getElementById(
            "balance"
        ).textContent =
            money(balance);


        /*
        -----------------------------
        PORTFOLIO VALUE
        -----------------------------
        */

        const portfolioValue =
            getPortfolioValue(data);


        document.getElementById(
            "portfolioValue"
        ).textContent =
            money(portfolioValue);


        /*
        -----------------------------
        TOTAL VALUE
        -----------------------------
        */

        const total =
            balance +
            portfolioValue;


        document.getElementById(
            "totalValue"
        ).textContent =
            money(total);


        /*
        -----------------------------
        POSITIONS
        -----------------------------
        */

        const positions =
            getPositions(data);


        document.getElementById(
            "positionCount"
        ).textContent =
            positions.length;


        renderPositions(
            positions
        );


        /*
        -----------------------------
        STATUS
        -----------------------------
        */

        statusText.textContent =
            "CONNECTED";

        statusDot.classList.remove(
            "error"
        );


        const now =
            new Date();


        document.getElementById(
            "updated"
        ).textContent =
            "Updated " +
            now.toLocaleTimeString();


        document.getElementById(
            "lastRefresh"
        ).textContent =
            "Last refresh: " +
            now.toLocaleTimeString();


    } catch (error) {

        console.error(
            "Portfolio error:",
            error
        );


        statusText.textContent =
            "CONNECTION ERROR";


        statusDot.classList.add(
            "error"
        );


        errorBox.style.display =
            "block";


        errorBox.textContent =
            "ERROR\n\n" +
            (
                error?.message ||
                String(error)
            );


        positionsBody.innerHTML = `
            <tr>
                <td colspan="6" class="empty">
                    Could not load portfolio
                </td>
            </tr>
        `;
    }

}


/*
==========================================================
 AUTO REFRESH
==========================================================
*/

loadPortfolio();


/*
    Refresh every 10 seconds.
*/

setInterval(
    loadPortfolio,
    10000
);

</script>

</body>
</html>
