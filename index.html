<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Position Ledger — Kalshi Dashboard</title>

<style>

* {
box-sizing: border-box;
}

body {
margin: 0;
background: #080b10;
color: #f4f7fb;
font-family: Arial, Helvetica, sans-serif;
}

header {
padding: 24px;
border-bottom: 1px solid #202632;
background: #0c1017;
position: sticky;
top: 0;
z-index: 10;
}

.header-row {
max-width: 1200px;
margin: auto;
display: flex;
justify-content: space-between;
align-items: center;
gap: 15px;
}

h1 {
margin: 0;
font-size: 25px;
}

.subtitle {
color: #8993a4;
margin-top: 5px;
font-size: 13px;
}

.status {
font-size: 12px;
color: #8cffb0;
}

main {
max-width: 1200px;
margin: auto;
padding: 22px;
}

.cards {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 15px;
}

.card {
background: #10151e;
border: 1px solid #222a36;
border-radius: 14px;
padding: 18px;
}

.card-label {
color: #8c97a8;
font-size: 12px;
}

.card-value {
font-size: 27px;
font-weight: bold;
margin-top: 8px;
}

.section {
margin-top: 30px;
}

.section-header {
display: flex;
justify-content: space-between;
align-items: center;
gap: 15px;
margin-bottom: 14px;
flex-wrap: wrap;
}

.section-title {
font-size: 20px;
font-weight: bold;
}

.controls {
display: flex;
gap: 8px;
flex-wrap: wrap;
}

select,
input {
background: #111722;
color: white;
border: 1px solid #2a3443;
border-radius: 8px;
padding: 9px 11px;
outline: none;
}

button {
border: 0;
border-radius: 9px;
padding: 10px 14px;
font-weight: bold;
cursor: pointer;
}

.btn-buy {
background: #27d17f;
color: #06150d;
}

.btn-buy:hover {
filter: brightness(1.08);
}

.btn-secondary {
background: #1b2330;
color: white;
}

.market-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 14px;
}

.market {
background: #10151e;
border: 1px solid #222a36;
border-radius: 14px;
padding: 17px;
position: relative;
}

.rank {
position: absolute;
right: 14px;
top: 14px;
font-size: 20px;
}

.market-title {
font-size: 16px;
font-weight: bold;
padding-right: 35px;
line-height: 1.3;
}

.market-subtitle {
color: #8993a4;
font-size: 12px;
margin-top: 6px;
line-height: 1.4;
}

.score {
margin-top: 13px;
font-size: 13px;
color: #8cffb0;
}

.metric-row {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 8px;
margin-top: 13px;
}

.metric {
background: #0b0f15;
border-radius: 9px;
padding: 9px;
}

.metric-label {
font-size: 10px;
color: #778294;
text-transform: uppercase;
}

.metric-value {
margin-top: 4px;
font-size: 13px;
font-weight: bold;
}

.settlement {
margin-top: 10px;
padding: 10px;
border-radius: 9px;
background: #111b27;
border: 1px solid #253345;
}

.settlement-label {
color: #8290a3;
font-size: 10px;
text-transform: uppercase;
}

.settlement-value {
margin-top: 4px;
font-size: 13px;
font-weight: bold;
}

.fast {
color: #8cffb0;
}

.warning {
color: #ffd166;
}

.muted {
color: #7f8a9c;
}

.actions {
display: flex;
gap: 8px;
margin-top: 14px;
}

.actions button {
flex: 1;
}

.nfl-list {
display: grid;
gap: 10px;
}

.nfl-game {
background: #10151e;
border: 1px solid #222a36;
border-radius: 12px;
padding: 14px;
}

.nfl-title {
font-weight: bold;
}

.nfl-market {
display: grid;
grid-template-columns: 1fr 90px 90px;
gap: 8px;
align-items: center;
margin-top: 9px;
}

.price {
background: #0a0f15;
border: 1px solid #27303d;
padding: 9px;
border-radius: 8px;
text-align: center;
font-weight: bold;
}

.price:hover {
background: #16202c;
}

.modal-backdrop {
position: fixed;
inset: 0;
background: rgba(0,0,0,.72);
display: none;
align-items: center;
justify-content: center;
padding: 20px;
z-index: 50;
}

.modal {
width: 100%;
max-width: 460px;
background: #10151e;
border: 1px solid #2b3544;
border-radius: 15px;
padding: 20px;
}

.modal h2 {
margin-top: 0;
}

.modal-row {
margin-top: 13px;
}

.modal-label {
color: #8993a4;
font-size: 12px;
margin-bottom: 5px;
}

.modal input,
.modal select {
width: 100%;
}

.cost {
margin-top: 14px;
padding: 13px;
background: #0b0f15;
border-radius: 10px;
}

.modal-actions {
display: flex;
gap: 9px;
margin-top: 17px;
}

.modal-actions button {
flex: 1;
}

.empty {
padding: 25px;
text-align: center;
color: #7e899b;
background: #10151e;
border: 1px solid #222a36;
border-radius: 12px;
}

.error {
color: #ff7777;
font-size: 13px;
margin-top: 10px;
}

@media(max-width: 850px) {

.cards {
grid-template-columns: 1fr;
}

.market-grid {
grid-template-columns: 1fr;
}

}

@media(max-width: 600px) {

main {
padding: 14px;
}

header {
padding: 17px;
}

.header-row {
align-items: flex-start;
}

.nfl-market {
grid-template-columns: 1fr 75px 75px;
}

}

</style>
</head>

<body>

<header>

<div class="header-row">

<div>
<h1>Position Ledger</h1>
<div class="subtitle">
Kalshi Dashboard
</div>
</div>

<div class="status" id="status">
Connecting...
</div>

</div>

</header>


<main>

<!-- ACCOUNT -->

<div class="cards">

<div class="card">
<div class="card-label">
Available Balance
</div>

<div class="card-value" id="balance">
—
</div>
</div>


<div class="card">
<div class="card-label">
Portfolio Value
</div>

<div class="card-value" id="portfolioValue">
—
</div>
</div>


<div class="card">
<div class="card-label">
Open Positions
</div>

<div class="card-value" id="positionCount">
—
</div>
</div>

</div>


<!-- TOP OPPORTUNITIES -->

<section class="section">

<div class="section-header">

<div>
<div class="section-title">
Top Opportunities
</div>

<div class="subtitle">
Non-political open markets
</div>

<div class="controls">

<select id="sortSelect">

<option value="score">
Opportunity
</option>

<option value="soonest">
Soonest Settlement

<option value="latest">
Latest Settlement

</select>


<input
id="minVolume"
type="number"
value="50"
min="0"
placeholder="Min volume"
>

id="maxSpread"

value="8"
min="1"

placeholder="Max spread"
>

<button

onclick="loadMarkets()"
>

</div>

</div>

<div class="empty">

</div>

</section>


<!-- NFL -->

<section class="section">

<div class="section-header">

<div>
<div class="section-title">
NFL
</div>

<div class="subtitle">
Live Kalshi NFL markets
</div>
</div>

<button
class="btn-secondary"
onclick="loadNFL()"
>
Refresh
</button>

</div>


<div id="nflList" class="nfl-list">

<div class="empty">
Loading NFL markets...
</div>

</div>

</section>

</main>


<!-- BUY MODAL -->

<div
id="modalBackdrop"
class="modal-backdrop"
>

<div class="modal">

<h2>
Buy Position
</h2>


<div class="modal-row">

<div class="modal-label">
Market
</div>

<div id="modalMarket">
—
</div>

</div>


<div class="modal-row">

<div class="modal-label">
Side
</div>

<select id="orderSide">

<option value="yes">
YES
</option>

<option value="no">
NO
</option>

</select>

</div>


<div class="modal-row">

<div class="modal-label">
Price — cents
</div>

<input
id="orderPrice"
type="number"
min="1"
max="99"
value="50"
>

</div>


<div class="modal-row">

<div class="modal-label">
Contracts
</div>

<input
id="orderCount"
type="number"
min="1"
max="1000"
value="1"
>

</div>


<div class="cost">

Max cost:
<strong id="maxCost">
$0.50
</strong>

</div>


<div
id="orderError"
class="error"
></div>


<div class="modal-actions">

<button
class="btn-secondary"
onclick="closeModal()"
>
Cancel
</button>

<button
class="btn-buy"
onclick="confirmBuy()"
>
Confirm BUY
</button>

</div>

</div>

</div>


<script>

const WORKER_URL =
"https://worker1.ryderolinger1.workers.dev";


let allMarkets = [];
let nflMarkets = [];

let selectedMarket = null;


/* ---------------------------------------
HELPERS
--------------------------------------- */

function money(value) {

const n = Number(value || 0);

return "$" + n.toFixed(2);
}


function number(value) {

const n = Number(value);

return Number.isFinite(n)
? n
: 0;
}


function getPrice(market, side) {

if (side === "yes") {

return number(
market.yes_ask ??
market.yes_ask_dollars * 100 ??
market.yes_bid ??
0
);

}

return number(
market.no_ask ??
market.no_ask_dollars * 100 ??
market.no_bid ??
0
);
}


function getYesAsk(market) {

if (market.yes_ask !== undefined)
return number(market.yes_ask);

if (market.yes_ask_dollars !== undefined)
return number(market.yes_ask_dollars) * 100;

return 0;
}


function getYesBid(market) {

if (market.yes_bid !== undefined)
return number(market.yes_bid);

if (market.yes_bid_dollars !== undefined)
return number(market.yes_bid_dollars) * 100;

return 0;
}


function getNoAsk(market) {

if (market.no_ask !== undefined)
return number(market.no_ask);

if (market.no_ask_dollars !== undefined)
return number(market.no_ask_dollars) * 100;

return 0;
}


function getNoBid(market) {

if (market.no_bid !== undefined)
return number(market.no_bid);

if (market.no_bid_dollars !== undefined)
return number(market.no_bid_dollars) * 100;

return 0;
}


/* ---------------------------------------
SETTLEMENT
--------------------------------------- */

function getSettlementDate(market) {

const fields = [

market.settlement_time,

market.expected_expiration_time,

market.expiration_time,

market.latest_expiration_time,

market.settlement_ts,

market.close_time

];

for (const value of fields) {

if (!value) continue;

const date = new Date(value);

if (!Number.isNaN(date.getTime())) {
return date;
}

}

return null;
}


function formatSettlement(market) {

const date =
getSettlementDate(market);

if (!date) {

return {
text: "Settlement unknown",
countdown: "—",
ms: Infinity
};

}


const now = Date.now();

const diff =
date.getTime() - now;


if (diff <= 0) {

return {
text: "Due now",
countdown: "Due now",
ms: diff
};

}


const totalMinutes =
Math.floor(diff / 60000);

const days =
Math.floor(totalMinutes / 1440);

const hours =
Math.floor(
(totalMinutes % 1440) / 60
);

const minutes =
totalMinutes % 60;


let countdown = "";

if (days > 0) {

countdown =
`${days}d ${hours}h`;

} else if (hours > 0) {

countdown =
`${hours}h ${minutes}m`;

} else {

countdown =
`${minutes}m`;

}


const text =
date.toLocaleString(
undefined,
{
month: "short",
day: "numeric",
hour: "numeric",
minute: "2-digit"
}
);


return {
text,
countdown,
ms: diff
};

}


/* ---------------------------------------
OPPORTUNITY SCORE
--------------------------------------- */

function scoreMarket(market) {

const volume =
number(
market.volume_number ??
market.volume ??
market.volume_fp
);


const volume24 =
number(
market.volume_24h_number ??
market.volume_24h ??
market.volume_24h_fp
);


const liquidity =
number(
market.liquidity_number ??
market.liquidity ??
market.liquidity_dollars
);


const yesBid =
getYesBid(market);

const yesAsk =
getYesAsk(market);

const noBid =
getNoBid(market);

const noAsk =
getNoAsk(market);


let spread = 99;

if (yesBid > 0 && yesAsk > 0) {

spread =
yesAsk - yesBid;

}


let score = 0;


/*
Liquidity
*/

score +=
Math.min(
liquidity / 100,
20
);


/*
Volume
*/

score +=
Math.min(
volume / 1000,
20
);


/*
24h activity
*/

score +=
Math.min(
volume24 / 500,
20
);


/*
Spread
*/

if (spread <= 2)
score += 20;

else if (spread <= 4)
score += 15;

else if (spread <= 6)
score += 10;

else if (spread <= 8)
score += 5;


/*
Price structure

Avoid markets where the displayed
side is extremely close to 0 or 100.
*/

const last =
number(
market.last_price ??
market.last_price_dollars * 100
);


if (
last >= 20 &&
last <= 80
) {

score += 10;

}


return Math.round(score * 10) / 10;
}


/* ---------------------------------------
LOAD PORTFOLIO
--------------------------------------- */

async function loadPortfolio() {

try {

const response =
await fetch(
WORKER_URL +
"/api/portfolio"
);

const data =
await response.json();


if (!data.ok) {

throw new Error(
JSON.stringify(data.error)
);

}


const balanceRaw =
data.balance?.balance ??
data.balance?.available_balance ??
0;


const balance =
number(balanceRaw) / 100;


document.getElementById(
"balance"
).textContent =
money(balance);


const positions =
Array.isArray(
data.positions?.market_positions
)
? data.positions.market_positions
: [];


document.getElementById(
"positionCount"
).textContent =
positions.length;


let portfolioValue = balance;


for (const position of positions) {

const qty =
Math.abs(
number(
position.position ??
position.quantity ??
0
)
);


const price =
number(
position.market_value ??
position.current_value ??
0
);


if (price > 0) {

portfolioValue +=
price / 100;

} else {

portfolioValue +=
qty;

}

}


document.getElementById(
"portfolioValue"
).textContent =
money(portfolioValue);


document.getElementById(
"status"
).textContent =
"Connected";

} catch (error) {

console.error(error);

document.getElementById(
"status"
).textContent =
"Connection error";

}

}


/* ---------------------------------------
LOAD MARKETS
--------------------------------------- */

async function loadMarkets() {

const grid =
document.getElementById(
"marketsGrid"
);


try {

grid.innerHTML =
`<div class="empty">
Loading opportunities...
</div>`;


const response =
await fetch(
WORKER_URL +
"/api/markets"
);


const data =
await response.json();


if (!data.ok) {

throw new Error(
JSON.stringify(data.error)
);

}


allMarkets =
Array.isArray(data.markets)
? data.markets
: [];


renderMarkets();

} catch (error) {

console.error(error);

grid.innerHTML =
`<div class="empty">
Unable to load markets.
<div class="error">
${escapeHtml(
error.message
)}
</div>
</div>`;

}

}


/* ---------------------------------------
RENDER MARKETS
--------------------------------------- */

function renderMarkets() {

const grid =
document.getElementById(
"marketsGrid"
);


const minVolume =
number(
document.getElementById(
"minVolume"
).value
);


const maxSpread =
number(
document.getElementById(
"maxSpread"
).value
);


const sort =
document.getElementById(
"sortSelect"
).value;


let markets =
allMarkets.filter(
market => {

const volume =
number(
market.volume_number ??
market.volume ??
market.volume_fp
);


const yesBid =
getYesBid(market);

const yesAsk =
getYesAsk(market);


let spread = 99;

if (
yesBid > 0 &&
yesAsk > 0
) {

spread =
yesAsk - yesBid;

}


return (
volume >= minVolume &&
spread <= maxSpread
);

}
);


markets =
markets.map(
market => ({

...market,

opportunityScore:
scoreMarket(market),

settlement:
formatSettlement(market)

})
);


if (sort === "soonest") {

markets.sort(
(a, b) =>
a.settlement.ms -
b.settlement.ms
);

} else if (sort === "latest") {

markets.sort(
(a, b) =>
b.settlement.ms -
a.settlement.ms
);

} else {

markets.sort(
(a, b) =>
b.opportunityScore -
a.opportunityScore
);

}


const visible =
markets.slice(0, 3);


if (!visible.length) {

grid.innerHTML =
`<div class="empty">
No markets match your filters.
</div>`;

return;

}


grid.innerHTML =
visible.map(
(market, index) =>
marketCard(
market,
index
)
).join("");

}


/* ---------------------------------------
MARKET CARD
--------------------------------------- */

function marketCard(
market,
index
) {

const yesAsk =
getYesAsk(market);

const noAsk =
getNoAsk(market);


const volume =
number(
market.volume_number ??
market.volume ??
market.volume_fp
);


const liquidity =
number(
market.liquidity_number ??
market.liquidity ??
market.liquidity_dollars
);


const settlement =
formatSettlement(market);


const settlementClass =
settlement.ms <
24 * 60 * 60 * 1000

? "fast"

: settlement.ms <
3 * 24 * 60 * 60 * 1000

? "warning"

: "muted";


const medals = [
"🥇",
"🥈",
"🥉"
];


return `

<div class="market">

<div class="rank">
${medals[index] || ""}
</div>


<div class="market-title">

${escapeHtml(
market.title ||
market.subtitle ||
market.ticker
)}

</div>


<div class="market-subtitle">

${escapeHtml(
market.subtitle ||
market.event_ticker ||
market.ticker
)}

</div>


<div class="score">

Opportunity Score:
<strong>
${market.opportunityScore}
</strong>

</div>


<div class="settlement">

<div class="settlement-label">
Expected Settlement
</div>

<div
class="settlement-value ${settlementClass}"
>

${settlement.countdown}
·
${settlement.text}

</div>

</div>


<div class="metric-row">

<div class="metric">

<div class="metric-label">
Volume
</div>

<div class="metric-value">
${volume.toLocaleString()}
</div>

</div>


<div class="metric">

<div class="metric-label">
Liquidity
</div>

<div class="metric-value">
${liquidity.toLocaleString()}
</div>

</div>


<div class="metric">

<div class="metric-label">
YES Ask
</div>

<div class="metric-value">
${yesAsk
? yesAsk.toFixed(0) + "¢"
: "—"}
</div>

</div>


<div class="metric">

<div class="metric-label">
NO Ask
</div>

<div class="metric-value">
${noAsk
? noAsk.toFixed(0) + "¢"
: "—"}
</div>

</div>

</div>


<div class="actions">

<button
class="btn-buy"
onclick='openBuy(${JSON.stringify(
market
)}, "yes")'
>
BUY YES
</button>


<button
class="btn-buy"
onclick='openBuy(${JSON.stringify(
market
)}, "no")'
>
BUY NO
</button>

</div>

</div>

`;

}


/* ---------------------------------------
NFL
--------------------------------------- */

async function loadNFL() {

const list =
document.getElementById(
"nflList"
);


try {

list.innerHTML =
`<div class="empty">
Loading NFL...
</div>`;


const response =
await fetch(
WORKER_URL +
"/api/nfl"
);


const data =
await response.json();


if (!data.ok) {

throw new Error(
JSON.stringify(data.error)
);

}


nflMarkets =
Array.isArray(data.markets)
? data.markets
: [];


renderNFL();

} catch (error) {

console.error(error);

list.innerHTML =
`<div class="empty">
Unable to load NFL markets.
</div>`;

}

}


function renderNFL() {

const list =
document.getElementById(
"nflList"
);


if (!nflMarkets.length) {

list.innerHTML =
`<div class="empty">
No open NFL markets found.
</div>`;

return;

}


const groups = {};


for (const market of nflMarkets) {

const key =
market.event_ticker ||
market.ticker;


if (!groups[key]) {
groups[key] = [];
}


groups[key].push(market);

}


const games =
Object.values(groups);


list.innerHTML =
games.map(
markets => {

const first =
markets[0];


return `

<div class="nfl-game">

<div class="nfl-title">

${escapeHtml(
first.title ||
first.event_ticker ||
"NFL Market"
)}

</div>


${markets.map(
market => {

const yes =
getYesAsk(market);

const no =
getNoAsk(market);


const settlement =
formatSettlement(market);


return `

<div class="nfl-market">

<div>

${escapeHtml(
market.subtitle ||
market.ticker
)}

<div class="subtitle">

Settles:
${settlement.countdown}

</div>

</div>


<button
class="price"
onclick='openBuy(${JSON.stringify(
market
)}, "yes")'
>
YES
${yes
? yes.toFixed(0) + "¢"
: "—"}
</button>


<button
class="price"
onclick='openBuy(${JSON.stringify(
market
)}, "no")'
>
NO
${no
? no.toFixed(0) + "¢"
: "—"}
</button>

</div>

`;

}
).join("")}

</div>

`;

}
).join("");

}


/* ---------------------------------------
BUY MODAL
--------------------------------------- */

function openBuy(
market,
side
) {

selectedMarket =
market;


document.getElementById(
"modalMarket"
).textContent =
market.title ||
market.subtitle ||
market.ticker;


document.getElementById(
"orderSide"
).value =
side;


const price =
side === "yes"

function closeModal() {

document.getElementById(

document.getElementById(

).value

document.getElementById(
"orderCount"
).value
);

(price * count) / 100;

).textContent =
money(cost);

/* ---------------------------------------
CONFIRM BUY
--------------------------------------- */

async function confirmBuy() {

if (!selectedMarket) {
return;
}


const side =
document.getElementById(
"orderSide"
).value;


const price =
number(
document.getElementById(
"orderPrice"
).value
);


const count =
number(
document.getElementById(
"orderCount"
).value
);


const errorBox =
document.getElementById(
"orderError"
);


errorBox.textContent =
"";


if (
price < 1 ||
price > 99
) {

errorBox.textContent =
"Price must be 1–99 cents.";

return;

}


if (
!Number.isInteger(count) ||
count < 1
) {

errorBox.textContent =
"Contracts must be at least 1.";

return;

}


const cost =
(price * count) / 100;


const confirmed =
confirm(
`BUY ${count} ${side.toUpperCase()} contract(s) at ${price}¢ each?\n\nMaximum cost: ${money(cost)}`
);


if (!confirmed) {
return;
}


try {

errorBox.textContent =
"Submitting order...";


const response =
await fetch(
WORKER_URL +
"/api/order",
{
method: "POST",

headers: {
"Content-Type":
"application/json"
},

body: JSON.stringify({

ticker:
selectedMarket.ticker,

side,

price,

count

})

}
);


const data =
await response.json();


if (!response.ok || !data.ok) {

throw new Error(
JSON.stringify(
data.error ||
data.order ||
data
)
);

}


errorBox.style.color =
"#8cffb0";

errorBox.textContent =
"Order submitted successfully.";


setTimeout(
closeModal,
1200
);


loadPortfolio();

} catch (error) {

console.error(error);

errorBox.style.color =
"#ff7777";

errorBox.textContent =
"Order failed: " +
error.message;

}

}


/* ---------------------------------------
ESCAPE HTML
--------------------------------------- */

function escapeHtml(value) {

return String(value || "")
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}
