<head>

.value{

.green{

.red{

}

.section{

.section-header{

.section-title{

.section-count{

canvas{

}

.table-wrap{

.nfl-title{
  font-size:16px;
  font-weight:700;
  margin-bottom:4px;

.nfl-date{

.nfl-row{

.progress-no{

<script>

/* ========================================================
   CONFIG
======================================================== */

const WORKER_URL =
  "https://worker1.ryderolinger1.workers.dev";

const PORTFOLIO_URL =
  WORKER_URL +
  "/api/portfolio";

const NFL_URL =
  WORKER_URL +
  "/api/nfl";


/* ========================================================
   HELPERS
======================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function money(value){

  const n =
    Number(value || 0);

  return n.toLocaleString(
    "en-US",
    {
      style:"currency",
      currency:"USD"
    }
  );

}


function formatDate(date){

  if(!date)
    return "";

  return date.toLocaleString(
    "en-US",
    {
      weekday:"short",
      month:"short",
      day:"numeric",
      hour:"numeric",
      minute:"2-digit"
    }
  );

}


/* ========================================================
   NFL DATE
======================================================== */

function getNFLDate(market){

  const possibleTimes = [

    market.occurrence_datetime,

    market.expected_expiration_time,

    market.expiration_time,

    market.latest_expiration_time,

    market.close_time

  ];


  for(
    const value of possibleTimes
  ){

    if(!value)
      continue;


    const d =
      new Date(value);


    if(
      !Number.isNaN(
        d.getTime()
      )
    ){

      return d;

    }

  }


  return null;

}


/* ========================================================
   NFL PRICE
======================================================== */

function priceToPercent(value){

  if(
    value === undefined ||
    value === null ||
    value === ""
  ){

    return null;

  }


  const n =
    Number(value);


  if(Number.isNaN(n))
    return null;


  /*
    0.63 = 63%
    63 = 63%
  */

  if(
    Math.abs(n) <= 1
  ){

    return n * 100;

  }


  return n;

}


function getMarketProbability(market){

  let price = null;


  /*
    Current Kalshi fields
  */

  if(
    market.yes_bid_dollars != null
  ){

    price =
      priceToPercent(
        market.yes_bid_dollars
      );

  }


  if(
    price === null &&
    market.yes_ask_dollars != null
  ){

    price =
      priceToPercent(
        market.yes_ask_dollars
      );

  }


  if(
    price === null &&
    market.last_price_dollars != null
  ){

    price =
      priceToPercent(
        market.last_price_dollars
      );

  }


  /*
    Older fields
  */

  if(
    price === null &&
    market.yes_bid != null
  ){

    price =
      priceToPercent(
        market.yes_bid
      );

  }


  if(
    price === null &&
    market.yes_ask != null
  ){

    price =
      priceToPercent(
        market.yes_ask
      );

  }


  if(
    price === null &&
    market.last_price != null
  ){

    price =
      priceToPercent(
        market.last_price
      );

  }


  if(price === null)
    return 0;


  return Math.max(
    0,
    Math.min(
      100,
      price
    )
  );

}


/* ========================================================
   TEAM NAME
======================================================== */

function getTeamName(market){

  let title =
    String(
      market.subtitle ||
      market.title ||
      ""
    ).trim();


  /*
    Clean common Kalshi wording.
  */

  title =
    title
      .replace(
        /^will\s+/i,
        ""
      )
      .replace(
        /\s+win\s+the\s+game\??$/i,
        ""
      )
      .replace(
        /\s+win\??$/i,
        ""
      )
      .replace(
        /\s+to\s+win.*$/i,
        ""
      )
      .replace(
        /\?$/,
        ""
      )
      .trim();


  return title ||
    String(
      market.ticker ||
      "Team"
    );

}


/* ========================================================
   GAME KEY
======================================================== */

function getGameKey(market){

  /*
    Best option:
    Kalshi event ticker.
  */

  if(
    market.event_ticker
  ){

    return String(
      market.event_ticker
    );

  }


  if(
    market.event_id
  ){

    return String(
      market.event_id
    );

  }


  if(
    market.event
  ){

    return String(
      market.event
    );

  }


  /*
    Fallback.
  */

  const date =
    getNFLDate(
      market
    );


  const dateKey =
    date
      ? date.toISOString().slice(0,10)
      : "unknown";


  return (
    dateKey +
    "|" +
    String(
      market.title ||
      market.subtitle ||
      ""
    )
      .replace(/\s+/g," ")
      .trim()
      .toLowerCase()
  );

}


/* ========================================================
   GROUP MARKETS INTO GAMES
======================================================== */

function groupNFLGames(markets){

  const groups =
    new Map();


  markets.forEach(
    market => {

      const key =
        getGameKey(
          market
        );


      if(
        !groups.has(key)
      ){

        groups.set(
          key,
          []
        );

      }


      groups
        .get(key)
        .push(market);

    }
  );


  return Array.from(
    groups.values()
  );

}


/* ========================================================
   GET TEAMS
======================================================== */

function getTeamsFromGame(
  gameMarkets
){

  const teams = [];


  gameMarkets.forEach(
    market => {

      const team =
        getTeamName(
          market
        );


      if(!team)
        return;


      const exists =
        teams.some(
          x =>
            x.name.toLowerCase() ===
            team.toLowerCase()
        );


      if(!exists){

        teams.push({

          name:team,

          probability:
            getMarketProbability(
              market
            ),

          market:market

        });

      }

    }
  );


  return teams.slice(
    0,
    2
  );

}


/* ========================================================
   NFL GAME CARD
======================================================== */

function renderNFLGame(
  gameMarkets
){

  const teams =
    getTeamsFromGame(
      gameMarkets
    );


  if(
    teams.length < 2
  ){

    return "";

  }


  let team1 =
    teams[0];


  let team2 =
    teams[1];


  /*
    Normalize so both sides
    represent the entire game.
  */

  const total =
    team1.probability +
    team2.probability;


  if(
    total > 0 &&
    Math.abs(total - 100) > 0.5
  ){

    team1.probability =
      (
        team1.probability /
        total
      ) * 100;


    team2.probability =
      (
        team2.probability /
        total
      ) * 100;

  }


  const date =
    getNFLDate(
      team1.market
    ) ||
    getNFLDate(
      team2.market
    );


  const volume =
    gameMarkets.reduce(
      (
        sum,
        market
      ) => {

        return sum +
          Number(
            market.volume_fp ??
            market.volume ??
            0
          );

      },
      0
    );


  return `

    <div class="nfl-card">

      <div class="nfl-title">
        ${escapeHtml(
          team1.name
        )}
        <span
          style="color:#59616e"
        >
          vs
        </span>
        ${escapeHtml(
          team2.name
        )}
      </div>


      <div class="nfl-date">

        ${
          date
            ? formatDate(date)
            : "NFL game"
        }

      </div>


      <div class="nfl-row">

        <span class="nfl-team">
          ${escapeHtml(
            team1.name
          )}
        </span>

        <span class="nfl-price yes">
          ${team1.probability.toFixed(0)}%
        </span>

      </div>


      <div class="nfl-row">

        <span class="nfl-team">
          ${escapeHtml(
            team2.name
          )}
        </span>

        <span class="nfl-price no">
          ${team2.probability.toFixed(0)}%
        </span>

      </div>


      <div class="progress">

        <div
          class="progress-yes"
          style="
            width:${team1.probability}%
          "
        ></div>

        <div
          class="progress-no"
          style="
            width:${team2.probability}%
          "
        ></div>

      </div>


      <div
        class="small"
        style="margin-top:13px"
      >

        Volume:
        ${volume.toLocaleString()}

      </div>

    </div>

  `;

}


/* ========================================================
   LOAD NFL
======================================================== */

async function loadNFL(){

  const status =
    document.getElementById(
      "nflStatus"
    );


  const count =
    document.getElementById(
      "nflCount"
    );


  const grid =
    document.getElementById(
      "nflGrid"
    );


  try{

    const response =
      await fetch(
        NFL_URL +
        "?t=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        JSON.stringify(data)
      );

    }


    let markets =
      Array.isArray(
        data.markets
      )
        ? data.markets
        : [];


    /*
      ONLY NFL GAME MARKETS
    */

    markets =
      markets.filter(
        market => {

          const ticker =
            String(
              market.ticker ||
              ""
            ).toUpperCase();


          const series =
            String(
              market.series_ticker ||
              ""
            ).toUpperCase();


          return (
            series === "KXNFLGAME" ||
            ticker.includes(
              "KXNFLGAME"
            )
          );

        }
      );


    /*
      TODAY THROUGH NEXT 7 DAYS
    */

    const now =
      new Date();


    const today =
      new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
      );


    const limit =
      new Date(
        today
      );


    limit.setDate(
      limit.getDate() + 7
    );


    markets =
      markets.filter(
        market => {

          const date =
            getNFLDate(
              market
            );


          if(!date)
            return false;


          const gameDay =
            new Date(
              date.getFullYear(),
              date.getMonth(),
              date.getDate()
            );


          return (
            gameDay >= today &&
            gameDay < limit
          );

        }
      );


    /*
      GROUP THE TEAM MARKETS
      INTO ONE GAME.
    */

    const games =
      groupNFLGames(
        markets
      );


    /*
      SORT BY GAME DATE
    */

    games.sort(
      (a,b) => {

        const dateA =
          getNFLDate(
            a[0]
          );


        const dateB =
          getNFLDate(
            b[0]
          );


        if(!dateA)
          return 1;


        if(!dateB)
          return -1;


        return dateA - dateB;

      }
    );


    if(
      !games.length
    ){

      status.textContent =
        "No NFL games found";

      count.textContent =
        "0 games";

      grid.innerHTML =
        `
          <div class="card">
            <div class="empty">
              No NFL games found for
              the next 7 days.
            </div>
          </div>
        `;

      return;

    }


    status.textContent =
      "Live Kalshi markets";


    count.textContent =
      games.length +
      (
        games.length === 1
          ? " game"
          : " games"
      );


    grid.innerHTML =
      games
        .map(
          renderNFLGame
        )
        .join("");


  }catch(error){

    console.error(
      "NFL error:",
      error
    );


    status.innerHTML =
      `
        <span class="error">
          NFL feed error
        </span>
      `;


    count.textContent =
      "Error";


    grid.innerHTML =
      "";

  }

}


/* ========================================================
   PORTFOLIO
======================================================== */

async function loadPortfolio(){

  const status =
    document.getElementById(
      "connectionStatus"
    );


  try{

    const response =
      await fetch(
        PORTFOLIO_URL +
        "?t=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        JSON.stringify(data)
      );

    }


    /*
      BALANCE
    */

    const balanceData =
      data.balance || {};


    let balance =
      Number(
        balanceData.balance ??
        balanceData.available_balance ??
        0
      );


    /*
      Kalshi balances can be
      represented in cents.
    */

    if(
      Math.abs(balance) > 100000
    ){

      balance =
        balance / 100;

    }


    /*
      POSITIONS
    */

    const positionData =
      data.positions || {};


    const positions =
      Array.isArray(
        positionData.positions
      )
        ? positionData.positions
        : [];


    let positionValue = 0;

    let livePL = 0;


    positions.forEach(
      position => {

        const qty =
          Number(
            position.position ||
            position.quantity ||
            0
          );


        const marketValue =
          Number(
            position.market_value ||
            position.value ||
            0
          );


        const pnl =
          Number(
            position.realized_pnl ||
            position.unrealized_pnl ||
            position.pnl ||
            0
          );


        positionValue +=
          marketValue;


        livePL +=
          pnl;

      }
    );


    if(
      Math.abs(positionValue) > 100000
    ){

      positionValue =
        positionValue / 100;

    }


    if(
      Math.abs(livePL) > 100000
    ){

      livePL =
        livePL / 100;

    }


    const total =
      balance +
      positionValue;


    document.getElementById(
      "balance"
    ).textContent =
      money(balance);


    document.getElementById(
      "portfolioValue"
    ).textContent =
      money(positionValue);


    document.getElementById(
      "totalValue"
    ).textContent =
      money(total);


    const plElement =
      document.getElementById(
        "livePL"
      );


    plElement.textContent =
      money(livePL);


    plElement.className =
      "value " +
      (
        livePL > 0
          ? "green"
          : livePL < 0
            ? "red"
            : ""
      );


    status.textContent =
      "Connected • " +
      new Date()
        .toLocaleTimeString();


    renderPositions(
      positions
    );


    savePLHistory(
      total
    );


    drawChart();

  }catch(error){

    console.error(
      "Portfolio error:",
      error
    );


    status.textContent =
      "Connection error";

  }

}


/* ========================================================
   POSITIONS TABLE
======================================================== */

function renderPositions(
  positions
){

  const body =
    document.getElementById(
      "positionsBody"
    );


  const count =
    document.getElementById(
      "positionCount"
    );


  count.textContent =
    positions.length +
    (
      positions.length === 1
        ? " position"
        : " positions"
    );


  if(!positions.length){

    body.innerHTML =
      `
        <tr>
          <td
            colspan="5"
            class="empty"
          >
            No open positions.
          </td>
        </tr>
      `;

    return;

  }


  body.innerHTML =
    positions
      .map(
        position => {

          const ticker =
            position.ticker ||
            position.market_ticker ||
            "Unknown";


          const side =
            Number(
              position.position ||
              0
            ) >= 0
              ? "YES"
              : "NO";


          const qty =
            Math.abs(
              Number(
                position.position ||
                position.quantity ||
                0
              )
            );


          const value =
            Number(
              position.market_value ||
              position.value ||
              0
            );


          const pnl =
            Number(
              position.unrealized_pnl ||
              position.realized_pnl ||
              position.pnl ||
              0
            );


          return `

            <tr>

              <td>
                ${escapeHtml(
                  ticker
                )}
              </td>

              <td>
                ${side}
              </td>

              <td>
                ${qty}
              </td>

              <td>
                ${money(value)}
              </td>

              <td
                class="${
                  pnl > 0
                    ? "green"
                    : pnl < 0
                      ? "red"
                      : ""
                }"
              >
                ${money(pnl)}
              </td>

            </tr>

          `;

        }
      )
      .join("");

}


/* ========================================================
   P/L HISTORY
======================================================== */

const HISTORY_KEY =
  "kalshi_pl_history_v1";


function savePLHistory(
  total
){

  let history = [];


  try{

    history =
      JSON.parse(
        localStorage.getItem(
          HISTORY_KEY
        ) || "[]"
      );

  }catch{

    history = [];

  }


  history.push({

    time:
      Date.now(),

    value:
      Number(total || 0)

  });


  /*
    Keep the latest 500 points.
  */

  if(
    history.length > 500
  ){

    history =
      history.slice(
        -500
      );

  }


  localStorage.setItem(
    HISTORY_KEY,
    JSON.stringify(history)
  );

}


/* ========================================================
   CHART
======================================================== */

function drawChart(){

  const canvas =
    document.getElementById(
      "plChart"
    );


  const ctx =
    canvas.getContext(
      "2d"
    );


  const rect =
    canvas.getBoundingClientRect();


  const dpr =
    window.devicePixelRatio ||
    1;


  canvas.width =
    rect.width *
    dpr;


  canvas.height =
    rect.height *
    dpr;


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  let history = [];


  try{

    history =
      JSON.parse(
        localStorage.getItem(
          HISTORY_KEY
        ) || "[]"
      );

  }catch{

    history = [];

  }


  const width =
    rect.width;


  const height =
    rect.height;


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  if(
    history.length < 2
  ){

    ctx.fillStyle =
      "#59616e";

    ctx.font =
      "13px sans-serif";

    ctx.fillText(
      "Waiting for performance history...",
      15,
      30
    );

    return;

  }


  const values =
    history.map(
      x =>
        Number(
          x.value || 0
        )
    );


  const min =
    Math.min(
      ...values
    );


  const max =
    Math.max(
      ...values
    );


  const range =
    max - min || 1;


  const padding =
    20;


  ctx.beginPath();


  values.forEach(
    (value,index) => {

      const x =
        padding +
        (
          index /
          (values.length - 1)
        ) *
        (
          width -
          padding * 2
        );


      const y =
        height -
        padding -
        (
          (
            value - min
          ) /
          range
        ) *
        (
          height -
          padding * 2
        );


      if(index === 0){

        ctx.moveTo(
          x,
          y
        );

      }else{

        ctx.lineTo(
          x,
          y
        );

      }

    }
  );


  ctx.strokeStyle =
    "#38d996";

  ctx.lineWidth =
    2;


  ctx.stroke();

}

======================================================== */

async function refresh(){

  await Promise.all([
    loadPortfolio(),
    loadNFL()
  ]);

}


/*
  Initial load
*/

refresh();


/*
  Refresh every 10 seconds
*/

setInterval(
  refresh,
  10000
);


/*
  Redraw chart when resized
*/

window.addEventListener(
  "resize",
  drawChart
);
