<html lang="en">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Position Ledger — Kalshi Dashboard</title>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
background: #08090d;
color: #f5f5f5;
font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;
}

.wrap {
width: min(1250px, 94%);
margin: 0 auto;
padding: 28px 0 60px;
}

h1 {
margin: 0;
font-size: 30px;
}

h2 {
margin: 0 0 16px;
font-size: 22px;
}

margin: 0 0 8px;
}

.sub {
color: #8e93a1;
margin-top: 6px;
margin-bottom: 24px;
}

.grid {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 12px;
margin-bottom: 25px;
}

.stat {

border-radius: 14px;
padding: 18px;

gap: 15px;

flex-wrap: wrap;
}

gap: 8px;
flex-wrap: wrap;

select,
input {

border: 1px solid #2b3040;
border-radius: 9px;

}

gap: 12px;

.title {

.muted {

font-size: 13px;
}

.badge {

align-items: center;
padding: 5px 9px;
border-radius: 999px;
background: #202532;
color: #d7dbe4;
font-size: 12px;
font-weight: 700;

}

.yes {
color: #66e3a2;
}

.no {
color: #ff8585;
}

.price {
font-size: 30px;
font-weight: 800;

}

.stats-row {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 8px;
margin-top: 13px;

.mini {

border-radius: 9px;
padding: 9px;
}

.mini-label {

}

font-size: 14px;

}

.reason {

font-size: 13px;
line-height: 1.45;
margin-top: 13px;
}

.calculator {
margin-top: 15px;
border-top: 1px solid #252a36;

.calculator label {
display: block;
color: #8b91a0;
font-size: 12px;
margin-bottom: 6px;
}

.money-input {
width: 100%;
font-size: 16px;
}

.calc-grid {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 8px;
margin-top: 10px;
}

.calc-box {
background: #0b0d12;
border-radius: 9px;
padding: 10px;
}

.calc-label {
color: #777e8d;
font-size: 11px;
margin-bottom: 4px;
}

.calc-value {
font-size: 15px;
font-weight: 700;
}

button {
width: 100%;
border: 0;
border-radius: 9px;
padding: 11px 14px;
cursor: pointer;
font-weight: 800;
margin-top: 12px;
background: #e8eaf0;
color: #0b0d12;
}

button:hover {
opacity: .9;
}

.nfl-game {
background: #11131a;
border: 1px solid #252a36;
border-radius: 15px;
padding: 17px;
}

.game-title {
font-size: 18px;
font-weight: 800;
margin-bottom: 12px;
}

.teams {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
margin-bottom: 10px;
}

.team {
background: #0b0d12;
border-radius: 10px;
padding: 12px;
}

.team-name {
font-weight: 700;
margin-bottom: 5px;
}

.side-buttons {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 8px;
}

.side-btn {

}

.empty {
background: #11131a;
border: 1px solid #252a36;
border-radius: 14px;
padding: 25px;
color: #858b9a;

grid-column: 1 / -1;

.status {
margin: 12px 0;
padding: 10px 12px;
border-radius: 9px;
background: #11131a;
border: 1px solid #252a36;
color: #aeb4c1;
font-size: 13px;
}

}

.error {

}

@media (max-width: 900px) {
.grid {
grid-template-columns: repeat(2, 1fr);
}

.opportunity-grid,
.nfl-grid {
grid-template-columns: 1fr;
}
}

@media (max-width: 600px) {
.grid {
grid-template-columns: 1fr 1fr;
}

.stats-row,
.calc-grid {
grid-template-columns: repeat(2, 1fr);
}

h1 {
font-size: 25px;
}
}
</style>
</head>

<body>

<div class="wrap">

<h1>Position Ledger</h1>
<div class="sub">
Kalshi market dashboard
</div>

<div id="status" class="status">
Loading...
</div>

<div class="grid">

<div class="stat">
<div class="stat-label">Balance</div>
<div id="balance" class="stat-value">$0.00</div>
</div>

<div class="stat">
<div class="stat-label">Open Positions</div>
<div id="positionCount" class="stat-value">0</div>
</div>

<div class="stat">
<div class="stat-label">Opportunities</div>
<div id="opportunityCount" class="stat-value">0</div>
</div>

<div class="stat">
<div class="stat-label">NFL Markets</div>
<div id="nflCount" class="stat-value">0</div>
</div>

</div>


<!-- TOP OPPORTUNITIES -->

<section>

<div class="section-head">

<div>
<h2>Top Opportunities</h2>
<div class="muted">
Non-political binary markets selected by the signal
</div>
</div>

<div class="controls">

<select id="sortSelect">
<option value="opportunity">
Opportunity
</option>

<option value="soonest">
Soonest Settlement
</option>

<option value="latest">
Latest Settlement
</option>
</select>

</div>

</div>

<div
id="opportunities"
class="opportunity-grid"
></div>

</section>


<!-- NFL -->

<section>

<div class="section-head">

<div>
<h2>NFL</h2>
<div class="muted">
Games grouped by event
</div>
</div>

</div>

<div
id="nfl"
class="nfl-grid"
></div>

</section>

</div>


<script>

const API =
"https://worker1.ryderolinger1.workers.dev";


let markets = [];
let nflMarkets = [];
let portfolio = null;


// ------------------------------------
// General helpers
// ------------------------------------

function money(value) {
const n = Number(value) || 0;

return "$" + n.toFixed(2);
}

function cents(value) {
const n = Number(value) || 0;

return Math.round(n * 100);
}

function formatDate(value) {
if (!value) return "Unknown";

const d = new Date(value);

if (Number.isNaN(d.getTime())) {
return "Unknown";
}

return d.toLocaleString();
}

function escapeHtml(value) {
return String(value ?? "")
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;");
}


// ------------------------------------
// Prices
// ------------------------------------

function yesAsk(market) {

const direct =
Number(market.yes_ask_dollars);

if (direct > 0 && direct < 1) {
return direct;
}

const noBid =
Number(market.no_bid_dollars);

if (noBid > 0 && noBid < 1) {
return 1 - noBid;
}

return Number(market.last_price_dollars) || 0;
}


function noAsk(market) {

const direct =
Number(market.no_ask_dollars);

if (direct > 0 && direct < 1) {
return direct;
}

const yesBid =
Number(market.yes_bid_dollars);

if (yesBid > 0 && yesBid < 1) {
return 1 - yesBid;
}

const last =
Number(market.last_price_dollars) || 0;

return last > 0
? 1 - last
: 0;
}


// ------------------------------------
// Signal / algorithm
// ------------------------------------

function sideAnalysis(market) {

const last =
Number(market.last_price_dollars) || 0;

const previous =
Number(market.previous_price_dollars) || last;

const yesAskPrice = yesAsk(market);
const noAskPrice = noAsk(market);

const yesMomentum =
last - previous;

const noMomentum =
-yesMomentum;


const liquidity =
Number(market.liquidity_number) || 0;

const volume =
Number(market.volume_number) || 0;

const volume24 =
Number(market.volume_24h_number) || 0;


function score(side, price, momentum) {

if (!(price > 0 && price < 1)) {
return -Infinity;
}

const probabilityProxy =
side === "yes"
? last
: 1 - last;

const momentumScore =
Math.max(0, Math.min(1, momentum / 0.10));

const liquidityScore =
Math.min(1, liquidity / 5000);

const volumeScore =
Math.min(1, volume / 10000);

const volume24Score =
Math.min(1, volume24 / 5000);


let spreadScore = 0;

const bid =
side === "yes"
? Number(market.yes_bid_dollars)
: Number(market.no_bid_dollars);

if (bid > 0 && price > bid) {

const spread =
price - bid;

spreadScore =
Math.max(
0,
Math.min(1, 0.05 / spread)
);
}


return (
probabilityProxy * 45 +
momentumScore * 20 +
liquidityScore * 15 +
volumeScore * 10 +
volume24Score * 5 +
spreadScore * 5
);
}


const yesScore =
score(
"yes",
yesAskPrice,
yesMomentum
);

const noScore =
score(
"no",
noAskPrice,
noMomentum
);


const side =
yesScore >= noScore
? "yes"
: "no";


const chosenScore =
side === "yes"
? yesScore
: noScore;


const chosenPrice =
side === "yes"
? yesAskPrice
: noAskPrice;


const reasons = [];


if (
side === "yes"
? yesMomentum > 0
: noMomentum > 0
) {
reasons.push("positive momentum");
}

if (liquidity > 0) {
reasons.push("liquidity");
}

if (volume24 > 0) {
reasons.push("recent activity");
}

if (chosenPrice > 0.65) {
reasons.push("strong market price");
}


return {
side,
price: chosenPrice,
score: chosenScore,
reason:
reasons.length
? reasons.join(", ")
: "market-price signal"
};
}


// ------------------------------------
// Calculator
// ------------------------------------

function calculateInvestment(
amount,
price
) {

const dollars =
Math.max(0, Number(amount) || 0);

const priceCents =
Math.round(price * 100);

if (
priceCents <= 0 ||
priceCents >= 100
) {
return {
contracts: 0,
actualCost: 0,
payout: 0,
profit: 0,
returnPct: 0,
unused: dollars
};
}


const contracts =
Math.floor(
dollars * 100 / priceCents
);


const actualCost =
contracts * priceCents / 100;


const payout =
contracts;


const profit =
payout - actualCost;


const returnPct =
actualCost > 0
? profit / actualCost * 100
: 0;


const unused =
dollars - actualCost;


return {
contracts,
actualCost,
payout,
profit,
returnPct,
unused
};
}


// ------------------------------------
// Opportunity card
// ------------------------------------

function opportunityCard(market) {

const analysis =
sideAnalysis(market);

if (!Number.isFinite(analysis.score)) {
return "";
}


const ticker =
market.ticker || "";

const title =
market.title ||
market.yes_sub_title ||
"Untitled market";


const price =
analysis.price;


const initialAmount = 100;

const calc =
calculateInvestment(
initialAmount,
price
);


return `

<div
class="card opportunity-card"
data-ticker="${escapeHtml(ticker)}"
data-side="${analysis.side}"
data-price="${price}"
>

<div class="card-top">

<div>

<div class="title">
${escapeHtml(title)}
</div>

<div class="muted">
${escapeHtml(ticker)}
</div>

</div>

<div class="badge">
BUY ${analysis.side.toUpperCase()}
</div>

</div>


<div class="price ${analysis.side}">
${(price * 100).toFixed(1)}¢
</div>


<div class="stats-row">

<div class="mini">
<div class="mini-label">
Signal
</div>

<div class="mini-value">
${analysis.score.toFixed(1)}
</div>
</div>


<div class="mini">
<div class="mini-label">
Settlement
</div>

<div class="mini-value">
${formatDate(
market.settlement_time
)}
</div>
</div>


<div class="mini">
<div class="mini-label">
Volume
</div>

<div class="mini-value">
${Number(
market.volume_number || 0
).toLocaleString()}
</div>
</div>

</div>


<div class="reason">
Signal factors: ${escapeHtml(
analysis.reason
)}.
This is a market-data heuristic,
not a guarantee of outcome.
</div>


<div class="calculator">

<label>
Investment amount
</label>

<input
class="money-input investment-input"
type="number"
min="0"
step="0.01"
value="${initialAmount}"
/>


<div class="calc-grid">

<div class="calc-box">
<div class="calc-label">
Contracts
</div>

<div class="calc-value contracts">
${calc.contracts}
</div>
</div>


<div class="calc-box">
<div class="calc-label">
Actual Cost
</div>

<div class="calc-value actual-cost">
${money(calc.actualCost)}
</div>
</div>


<div class="calc-box">
<div class="calc-label">
Potential Payout
</div>

<div class="calc-value payout">
${money(calc.payout)}
</div>
</div>


<div class="calc-box">
<div class="calc-label">
Potential Profit
</div>

<div class="calc-value profit">
${money(calc.profit)}
</div>
</div>


<div class="calc-box">
<div class="calc-label">
Return
</div>

<div class="calc-value return-pct">
${calc.returnPct.toFixed(1)}%
</div>
</div>


<div class="calc-box">
<div class="calc-label">
Unused
</div>

<div class="calc-value unused">
${money(calc.unused)}
</div>
</div>

</div>


<button
class="buy-opportunity"
data-ticker="${escapeHtml(ticker)}"
data-side="${analysis.side}"
data-price="${price}"
>
BUY ${analysis.side.toUpperCase()}
</button>

</div>

</div>
`;
}


// ------------------------------------
// Render opportunities
// ------------------------------------

function renderOpportunities() {

const container =
document.getElementById(
"opportunities"
);


const sort =
document.getElementById(
"sortSelect"
).value;


let list =
markets
.map(market => ({
market,
analysis: sideAnalysis(market)
}))
.filter(item =>
Number.isFinite(item.analysis.score)
);


if (sort === "opportunity") {

list.sort(
(a, b) =>
b.analysis.score -
a.analysis.score
);

} else if (sort === "soonest") {

list.sort(
(a, b) =>
new Date(
a.market.settlement_time || 0
) -
new Date(
b.market.settlement_time || 0
)
);

} else if (sort === "latest") {

list.sort(
(a, b) =>
new Date(
b.market.settlement_time || 0
) -
new Date(
a.market.settlement_time || 0
)
);
}


list =
list.slice(0, 20);


document.getElementById(
"opportunityCount"
).textContent = list.length;


if (!list.length) {

container.innerHTML = `
<div class="empty">
No markets match the current filters.
</div>
`;

return;
}


container.innerHTML =
list
.map(item =>
opportunityCard(item.market)
)
.join("");
}


// ------------------------------------
// NFL team names
// ------------------------------------

const NFL_TEAMS = {

ARI: "Arizona Cardinals",
ATL: "Atlanta Falcons",
BAL: "Baltimore Ravens",
BUF: "Buffalo Bills",
CAR: "Carolina Panthers",
CHI: "Chicago Bears",
CIN: "Cincinnati Bengals",
CLE: "Cleveland Browns",
DAL: "Dallas Cowboys",
DEN: "Denver Broncos",
DET: "Detroit Lions",
GB: "Green Bay Packers",
HOU: "Houston Texans",
IND: "Indianapolis Colts",
JAX: "Jacksonville Jaguars",
KC: "Kansas City Chiefs",
LV: "Las Vegas Raiders",
LAC: "Los Angeles Chargers",
LAR: "Los Angeles Rams",
MIA: "Miami Dolphins",
MIN: "Minnesota Vikings",
NE: "New England Patriots",
NO: "New Orleans Saints",
NYG: "New York Giants",
NYJ: "New York Jets",
PHI: "Philadelphia Eagles",
PIT: "Pittsburgh Steelers",
SF: "San Francisco 49ers",
SEA: "Seattle Seahawks",
TB: "Tampa Bay Buccaneers",
TEN: "Tennessee Titans",
WAS: "Washington Commanders"

};


function getTeamName(market) {

const candidates = [

market.yes_sub_title,
market.yes_subtitle,
market.subtitle,
market.team_name,
market.team

];


for (const value of candidates) {

if (value) {

const text =
String(value).trim();

if (text) {

const upper =
text.toUpperCase();

if (NFL_TEAMS[upper]) {
return NFL_TEAMS[upper];
}

return text;
}
}
}


const ticker =
String(market.ticker || "");


const parts =
ticker.split("-");


const last =
parts[parts.length - 1];


if (NFL_TEAMS[last]) {
return NFL_TEAMS[last];
}


return "NFL Team";
}


// ------------------------------------
// NFL grouping
// ------------------------------------

function getEventKey(market) {

return (
market.event_ticker ||
market.eventTicker ||
market.event_id ||
market.ticker ||
"unknown"
);
}


function renderNFL() {

const container =
document.getElementById("nfl");


const groups = {};


for (const market of nflMarkets) {

const key =
getEventKey(market);


if (!groups[key]) {
groups[key] = [];
}


groups[key].push(market);
}


const groupList =
Object.entries(groups);


if (!groupList.length) {

container.innerHTML = `
<div class="empty">
No NFL markets found.
</div>
`;

return;
}


container.innerHTML =
groupList
.map(
([eventTicker, group]) => {

const teams = {};


for (const market of group) {

const team =
getTeamName(market);

if (!teams[team]) {
teams[team] = [];
}

teams[team].push(market);
}


const teamNames =
Object.keys(teams);


const title =
teamNames.length >= 2
? `${teamNames[0]} vs ${teamNames[1]}`
: (
group[0].title ||
"NFL Game"
);


const buttons =
group
.map(market => {

const yes =
yesAsk(market);

const no =
noAsk(market);

const ticker =
market.ticker || "";

const team =
getTeamName(market);


return `

<div class="team">

<div class="team-name">
${escapeHtml(team)}
</div>

<div class="muted">
${escapeHtml(
ticker
)}
</div>

<div class="side-buttons">

<button
class="side-btn nfl-order"
data-ticker="${escapeHtml(ticker)}"
data-side="yes"
data-price="${yes}"
>
YES ${(yes * 100).toFixed(1)}¢
</button>

<button
class="side-btn nfl-order"
data-ticker="${escapeHtml(ticker)}"
data-side="no"
data-price="${no}"
>
NO ${(no * 100).toFixed(1)}¢
</button>

</div>

</div>

`;
})
.join("");


return `

<div class="nfl-game">

<div class="game-title">
${escapeHtml(title)}
</div>

<div class="muted">
${escapeHtml(eventTicker)}
</div>

<div class="teams">
${buttons}
</div>

</div>

`;
}
)
.join("");
}


// ------------------------------------
// Portfolio
// ------------------------------------

async function loadPortfolio() {

const response =
await fetch(
`${API}/api/portfolio`
);


if (!response.ok) {
throw new Error(
"Portfolio request failed."
);
}


portfolio =
await response.json();


const balanceValue =
portfolio?.balance?.balance;


const dollars =
Number(balanceValue || 0) / 100;


document.getElementById(
"balance"
).textContent =
money(dollars);


const positions =
portfolio?.positions?.market_positions ||
portfolio?.positions?.positions ||
[];


document.getElementById(
"positionCount"
).textContent =
positions.length;
}


// ------------------------------------
// Markets
// ------------------------------------

async function loadMarkets() {

const response =
await fetch(
`${API}/api/markets`
);


if (!response.ok) {
throw new Error(
"Markets request failed."
);
}


const data =
await response.json();


markets =
Array.isArray(data.markets)
? data.markets
: [];


renderOpportunities();
}


// ------------------------------------
// NFL
// ------------------------------------

async function loadNFL() {

const response =
await fetch(
`${API}/api/nfl`
);


if (!response.ok) {
throw new Error(
"NFL request failed."
);
}


const data =
await response.json();


nflMarkets =
Array.isArray(data.markets)
? data.markets
: [];


document.getElementById(
"nflCount"
).textContent =
nflMarkets.length;


renderNFL();
}


// ------------------------------------
// Order
// ------------------------------------

async function placeOrder(
ticker,
side,
price
) {

const amount =
prompt(
`How many dollars do you want to invest in ${side.toUpperCase()}?`,
"10"
);


if (amount === null) {
return;
}


const dollars =
Number(amount);


if (
!Number.isFinite(dollars) ||
dollars <= 0
) {

alert(
"Enter a valid dollar amount."
);

return;
}


const calculation =
calculateInvestment(
dollars,
price
);


if (calculation.contracts <= 0) {

alert(
"That amount is too small for even 1 contract at the current price."
);

return;
}


const confirmed =
confirm(
[
`BUY ${side.toUpperCase()}`,
``,
`Ticker: ${ticker}`,
`Contracts: ${calculation.contracts}`,
`Estimated cost: ${money(calculation.actualCost)}`,
`Current price: ${(price * 100).toFixed(1)}¢`,
``,
`Place order?`
].join("\n")
);


if (!confirmed) {
return;
}


try {

setStatus(
"Placing order..."
);


const response =
await fetch(
`${API}/api/order`,
{
method: "POST",

headers: {
"Content-Type":

},

body: JSON.stringify({
ticker,
side,
count:

);

await response.json();

throw new Error(

// ------------------------------------
// Status
// ------------------------------------

function setStatus(
message,
success = null
) {

const el =
document.getElementById(
"status"
);


el.textContent =
message;


el.className =
"status";


if (success === true) {
el.classList.add("success");
}

if (success === false) {
el.classList.add("error");
}
}


// ------------------------------------
// Events
// ------------------------------------

document.addEventListener(
"input",
event => {

if (
!event.target.classList.contains(
"investment-input"
)
) {
return;
}


const card =
event.target.closest(
".opportunity-card"
);


if (!card) return;


const amount =
Number(event.target.value);


const price =
Number(
card.dataset.price
);


const calc =
calculateInvestment(
amount,
price
);


card.querySelector(
".contracts"
).textContent =
calc.contracts;


card.querySelector(
".actual-cost"
).textContent =
money(calc.actualCost);


card.querySelector(
".payout"
).textContent =
money(calc.payout);


card.querySelector(
".profit"
).textContent =
money(calc.profit);


card.querySelector(
".return-pct"
).textContent =
calc.returnPct.toFixed(1) + "%";


card.querySelector(
".unused"
).textContent =
money(calc.unused);

}
);


document.addEventListener(
"click",
event => {

const button =
event.target.closest(
".buy-opportunity, .nfl-order"
);


if (!button) {
return;
}


const ticker =
button.dataset.ticker;


const side =
button.dataset.side;


const price =
Number(
button.dataset.price
);


if (!ticker || !side || !price) {
return;
}


placeOrder(
ticker,
side,
price
);
}
);


document
.getElementById("sortSelect")
.addEventListener(
"change",
renderOpportunities
);


// ------------------------------------
// Start
// ------------------------------------

async function start() {

try {

setStatus(
"Loading dashboard..."
);


await Promise.all([
loadPortfolio(),
loadMarkets(),
loadNFL()
]);


setStatus(
"Dashboard loaded.",
true
);

} catch (error) {

console.error(error);


setStatus(
error.message ||
"Failed to load dashboard.",
false
);
}
}


start();

</script>
