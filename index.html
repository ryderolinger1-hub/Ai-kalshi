<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Position Ledger — Kalshi Dashboard</title>

<style>

* {
box-sizing: border-box;
}

body {
margin: 0;
background: #080b10;
color: #f4f7fb;
font-family: Arial, Helvetica, sans-serif;
}

header {
padding: 22px;
border-bottom: 1px solid #202632;
background: #0c1017;
position: sticky;
top: 0;
z-index: 10;
}

.header-row {
max-width: 1200px;
margin: auto;
display: flex;
justify-content: space-between;
align-items: center;
}

h1 {
margin: 0;
font-size: 25px;
}

.subtitle {
color: #8993a4;
margin-top: 5px;
font-size: 13px;
}

.status {
font-size: 12px;
color: #8cffb0;
}

main {
max-width: 1200px;
margin: auto;
padding: 22px;
}

.cards {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 15px;
}

.card {
background: #10151e;
border: 1px solid #222a36;
border-radius: 14px;
padding: 18px;
}

.card-label {
color: #8c97a8;
font-size: 12px;
}

.card-value {
font-size: 27px;
font-weight: bold;
margin-top: 8px;
}

.section {
margin-top: 30px;
}

.section-header {
display: flex;
justify-content: space-between;
align-items: center;
gap: 15px;
margin-bottom: 14px;
flex-wrap: wrap;
}

.section-title {
font-size: 20px;
font-weight: bold;
}

.controls {
display: flex;
gap: 8px;
flex-wrap: wrap;
}

select,
input {
background: #111722;
color: white;
border: 1px solid #2a3443;
border-radius: 8px;
padding: 9px 11px;
outline: none;
}

button {
border: 0;
border-radius: 9px;
padding: 10px 14px;
font-weight: bold;
cursor: pointer;
}

.btn-buy {
background: #27d17f;
color: #06150d;
}

.btn-secondary {
background: #1b2330;
color: white;
}

.market-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);

.market {

border: 1px solid #222a36;
border-radius: 14px;
padding: 17px;
position: relative;
}

.rank {
position: absolute;
right: 14px;
top: 14px;
font-size: 20px;
}

.market-title {
font-size: 16px;

padding-right: 35px;
line-height: 1.3;
}

.market-subtitle {
color: #8993a4;
font-size: 12px;
margin-top: 6px;
}

.score {
margin-top: 13px;
font-size: 13px;
color: #8cffb0;
}

.metric-row {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 8px;
margin-top: 13px;
}

.metric {
background: #0b0f15;
border-radius: 9px;
padding: 9px;
}

.metric-label {
font-size: 10px;
color: #778294;
text-transform: uppercase;
}

.metric-value {
margin-top: 4px;
font-size: 13px;
font-weight: bold;
}

padding: 10px;
border-radius: 9px;
background: #111b27;
border: 1px solid #253345;
}

.settlement-label {
color: #8290a3;
font-size: 10px;
text-transform: uppercase;
}

.settlement-value {
margin-top: 4px;
font-size: 13px;
font-weight: bold;
}

.fast {
color: #8cffb0;
}

.warning {
color: #ffd166;
}

.muted {
color: #7f8a9c;
}

.actions {
display: flex;
gap: 8px;
margin-top: 14px;
}

.actions button {
flex: 1;
}

.nfl-list {
display: grid;
gap: 12px;
}

.nfl-game {
background: #10151e;
border: 1px solid #222a36;
border-radius: 14px;
padding: 16px;
}

.nfl-game-title {
font-size: 18px;
font-weight: bold;
}

.nfl-game-meta {
color: #8993a4;
font-size: 12px;
margin-top: 5px;
}

.nfl-market {
display: grid;
grid-template-columns: 1fr 90px 90px;
gap: 8px;
align-items: center;
margin-top: 12px;
}

.team-name {
font-weight: bold;
}

.price {
background: #0a0f15;
color: white;
border: 1px solid #27303d;
padding: 9px;
border-radius: 8px;
text-align: center;
font-weight: bold;
}

.price:hover {
background: #16202c;
}

.empty {
padding: 25px;
text-align: center;
color: #7e899b;
background: #10151e;
border: 1px solid #222a36;
border-radius: 12px;
}

.error {
color: #ff7777;
font-size: 13px;
margin-top: 10px;
}

.modal-backdrop {
position: fixed;
inset: 0;
background: rgba(0,0,0,.72);
display: none;
align-items: center;
justify-content: center;
padding: 20px;
z-index: 50;
}

.modal {
width: 100%;
max-width: 460px;
background: #10151e;
border: 1px solid #2b3544;
border-radius: 15px;
padding: 20px;
}

.modal h2 {
margin-top: 0;
}

.modal-row {
margin-top: 13px;
}

.modal-label {
color: #8993a4;
font-size: 12px;
margin-bottom: 5px;
}

.modal input,
.modal select {
width: 100%;
}

.cost {
margin-top: 14px;
padding: 13px;
background: #0b0f15;
border-radius: 10px;
}

.modal-actions {
display: flex;
gap: 9px;
margin-top: 17px;
}

.modal-actions button {
flex: 1;
}

@media(max-width:850px) {

.cards {
grid-template-columns: 1fr;
}

.market-grid {
grid-template-columns: 1fr;
}

}

@media(max-width:600px) {

main {
padding: 14px;
}

header {
padding: 17px;
}

.nfl-market {
grid-template-columns: 1fr 75px 75px;
}

}

</style>

</head>

<script>

const WORKER_URL =
"https://worker1.ryderolinger1.workers.dev";


let allMarkets = [];
let nflMarkets = [];
let selectedMarket = null;


/* ================================
HELPERS
================================ */

function num(value) {

if (
value === null ||
value === undefined ||
value === ""
) {
return 0;
}

const n = Number(value);

return Number.isFinite(n)
? n
: 0;
}


function money(value) {

return "$" +
num(value).toFixed(2);

}


function escapeHtml(value) {

return String(value || "")
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;");

}


/* ================================
PRICES
================================ */

function yesBid(m) {

if (m.yes_bid !== undefined)
return num(m.yes_bid);

if (m.yes_bid_dollars !== undefined)
return num(m.yes_bid_dollars) * 100;

return 0;
}


function yesAsk(m) {

if (m.yes_ask !== undefined)
return num(m.yes_ask);

if (m.yes_ask_dollars !== undefined)
return num(m.yes_ask_dollars) * 100;

return 0;
}


function noBid(m) {

if (m.no_bid !== undefined)
return num(m.no_bid);

if (m.no_bid_dollars !== undefined)
return num(m.no_bid_dollars) * 100;

return 0;
}


function noAsk(m) {

if (m.no_ask !== undefined)
return num(m.no_ask);

if (m.no_ask_dollars !== undefined)
return num(m.no_ask_dollars) * 100;

return 0;
}


/* ================================
SPREAD
================================ */

function getSpread(market) {

const bid = yesBid(market);
const ask = yesAsk(market);

if (
bid > 0 &&
ask > 0 &&
ask >= bid
) {
return ask - bid;
}

/*
IMPORTANT:
Unknown spread is null,
NOT 99.
*/

return null;
}


/* ================================
SETTLEMENT
================================ */

function getSettlementDate(market) {

const values = [

market.settlement_time,

market.expected_expiration_time,

market.expiration_time,

market.latest_expiration_time,

market.settlement_ts,

market.close_time

];


for (const value of values) {

if (!value) continue;

const d = new Date(value);

if (!Number.isNaN(d.getTime())) {
return d;
}

}


return null;
}


function settlementInfo(market) {

const date =
getSettlementDate(market);


if (!date) {

return {
ms: Infinity,
countdown: "Unknown",
date: "Settlement unavailable"
};

}


const diff =
date.getTime() -
Date.now();


if (diff <= 0) {

return {
ms: diff,
countdown: "Due now",
date: date.toLocaleString()
};

}


const minutes =
Math.floor(
diff / 60000
);


const days =
Math.floor(
minutes / 1440
);


const hours =
Math.floor(
(minutes % 1440) / 60
);


const mins =
minutes % 60;


let countdown;


if (days > 0) {

countdown =
`${days}d ${hours}h`;

} else if (hours > 0) {

countdown =
`${hours}h ${mins}m`;

} else {

countdown =
`${mins}m`;

}


return {

ms: diff,

countdown,

date:
date.toLocaleString(
undefined,
{
month: "short",
day: "numeric",
hour: "numeric",
minute: "2-digit"
}
)

};

}


/* ================================
OPPORTUNITY SCORE
================================ */

function scoreMarket(market) {

const volume =
num(
market.volume_number ??
market.volume ??
market.volume_fp
);


const volume24 =
num(
market.volume_24h_number ??
market.volume_24h ??
market.volume_24h_fp
);


const liquidity =
num(
market.liquidity_number ??
market.liquidity ??
market.liquidity_dollars
);


const spread =
getSpread(market);


let score = 0;


/* Liquidity */

score += Math.min(
liquidity / 100,
20
);


/* Total volume */

score += Math.min(
volume / 1000,
20
);


/* 24h volume */

score += Math.min(
volume24 / 500,
20
);


/* Spread */

if (spread !== null) {

if (spread <= 2)
score += 20;

else if (spread <= 4)
score += 15;

else if (spread <= 6)
score += 10;

else if (spread <= 8)
score += 5;

}


/* Price structure */

const last =
num(
market.last_price ??
(
market.last_price_dollars !== undefined
? market.last_price_dollars * 100
: 0
)
);


if (
last >= 20 &&
last <= 80
) {

score += 10;

}


return Math.round(
score * 10
) / 10;

}


/* ================================
PORTFOLIO
================================ */

async function loadPortfolio() {

try {

const response =
await fetch(
WORKER_URL +
"/api/portfolio"
);


const data =
await response.json();


if (!data.ok)
throw new Error(
JSON.stringify(data.error)
);


const balance =
num(
data.balance?.balance ??
data.balance?.available_balance
) / 100;


document.getElementById(
"balance"
).textContent =
money(balance);


const positions =
Array.isArray(
data.positions?.market_positions
)
? data.positions.market_positions
: [];


document.getElementById(
"positionCount"
).textContent =
positions.length;


document.getElementById(
"portfolioValue"
).textContent =
money(balance);


document.getElementById(
"status"
).textContent =
"Connected";

} catch (error) {

console.error(error);

document.getElementById(
"status"
).textContent =
"Connection error";

}

}


/* ================================
MARKETS
================================ */

async function loadMarkets() {

const grid =
document.getElementById(
"marketsGrid"
);


grid.innerHTML =
`<div class="empty">
Loading markets...
</div>`;


try {

const response =
await fetch(
WORKER_URL +
"/api/markets"
);


const data =
await response.json();


if (!data.ok)
throw new Error(
JSON.stringify(data.error)
);


allMarkets =
Array.isArray(data.markets)
? data.markets
: [];


renderMarkets();


} catch (error) {

console.error(error);

grid.innerHTML =
`<div class="empty">
Unable to load markets.
<div class="error">
${escapeHtml(
error.message
)}
</div>
</div>`;

}

}


/* ================================
RENDER MARKETS
================================ */

function renderMarkets() {

const grid =
document.getElementById(
"marketsGrid"
);


const minVolume =
num(
document.getElementById(
"minVolume"
).value
);


const maxSpread =
num(
document.getElementById(
"maxSpread"
).value
);


const sort =
document.getElementById(
"sortSelect"
).value;


let markets =
allMarkets.filter(
market => {

const volume =
num(
market.volume_number ??
market.volume ??
market.volume_fp
);


const spread =
getSpread(market);


/*
If spread is unknown,
don't eliminate the market.
*/

const spreadOkay =
spread === null ||
spread <= maxSpread;


return (
volume >= minVolume &&
spreadOkay
);

}
);


markets =
markets.map(
market => {

const settlement =
settlementInfo(market);


return {

...market,

opportunityScore:
scoreMarket(market),

settlement

};

}
);


if (sort === "soonest") {

markets.sort(
(a, b) =>
a.settlement.ms -
b.settlement.ms
);

} else if (sort === "latest") {

markets.sort(
(a, b) =>
b.settlement.ms -
a.settlement.ms
);

} else {

markets.sort(
(a, b) =>
b.opportunityScore -
a.opportunityScore
);

}


const top =
markets.slice(0, 3);


if (!top.length) {

grid.innerHTML =
`<div class="empty">
No markets match your filters.
</div>`;

return;

}


grid.innerHTML =
top.map(
(market, index) =>
marketCard(
market,
index
)
).join("");

}


/* ================================
MARKET CARD
================================ */

function marketCard(
market,
index
) {

const settlement =
market.settlement ||
settlementInfo(market);


const spread =
getSpread(market);


const volume =
num(
market.volume_number ??
market.volume ??
market.volume_fp
);


const liquidity =
num(
market.liquidity_number ??
market.liquidity ??
market.liquidity_dollars
);


const medals = [
"🥇",
"🥈",
"🥉"
];


return `

<div class="market">

<div class="rank">
${medals[index] || ""}
</div>


<div class="market-title">

${escapeHtml(
market.title ||
market.subtitle ||
market.ticker
)}

</div>


<div class="market-subtitle">

${escapeHtml(
market.subtitle ||
market.event_ticker ||
market.ticker
)}

</div>


<div class="score">

Opportunity Score:

<strong>
${market.opportunityScore}
</strong>

</div>


<div class="settlement">

<div class="settlement-label">
Expected Settlement
</div>

<div class="settlement-value">

${settlement.countdown}

·

${escapeHtml(
settlement.date
)}

</div>

</div>


<div class="metric-row">

<div class="metric">

<div class="metric-label">
Volume
</div>

<div class="metric-value">
${volume.toLocaleString()}
</div>

</div>


<div class="metric">

<div class="metric-label">
Liquidity
</div>

<div class="metric-value">
${liquidity.toLocaleString()}
</div>

</div>


<div class="metric">

<div class="metric-label">
Spread
</div>

<div class="metric-value">

${
spread === null
? "—"
: spread.toFixed(0) + "¢"
}

</div>

</div>


<div class="metric">

<div class="metric-label">
YES Ask
</div>

<div class="metric-value">

${
yesAsk(market)
? yesAsk(market).toFixed(0) + "¢"
: "—"
}

</div>

</div>

</div>


<div class="actions">

<button
class="btn-buy"
onclick='openBuy(${JSON.stringify(
market
)}, "yes")'
>
BUY YES
</button>


<button
class="btn-buy"
onclick='openBuy(${JSON.stringify(
market
)}, "no")'
>
BUY NO
</button>

</div>

</div>

`;

}


/* ================================
NFL
================================ */

async function loadNFL() {

const list =
document.getElementById(
"nflList"
);


list.innerHTML =
`<div class="empty">
Loading NFL...
</div>`;


try {

const response =
await fetch(
WORKER_URL +
"/api/nfl"
);


const data =
await response.json();


if (!data.ok)
throw new Error(
JSON.stringify(data.error)
);


nflMarkets =
Array.isArray(data.markets)
? data.markets
: [];


renderNFL();


} catch (error) {

console.error(error);

list.innerHTML =
`<div class="empty">
Unable to load NFL markets.
<div class="error">
${escapeHtml(
error.message
)}
</div>
</div>`;

}

}


/* ================================
NFL TEAM NAME EXTRACTION
================================ */

function cleanTeamName(value) {

if (!value)
return "";


let name =
String(value).trim();


name =
name
.replace(/^will\s+/i, "")
.replace(/^the\s+/i, "")
.replace(/\s+to\s+win.*$/i, "")
.replace(/\s+win.*$/i, "")
.replace(/\?$/g, "")
.trim();


return name;

}


function getTeamName(market) {

const candidates = [

market.subtitle,

market.yes_sub_title,

market.yes_subtitle,

market.team,

market.team_name,

market.title

];


for (const value of candidates) {

const cleaned =
cleanTeamName(value);


if (
cleaned &&
cleaned.length < 70
) {
return cleaned;
}

}


return "";

}


/* ================================
NFL GROUPING
================================ */

function groupNFLMarkets() {

const groups = {};


for (const market of nflMarkets) {

/*
event_ticker is the important part.

All markets belonging to the same
NFL game go into the same group.
*/

const key =
market.event_ticker ||
market.event_ticker_name ||
market.ticker;


if (!groups[key]) {

groups[key] = [];

}


groups[key].push(market);

}


return Object.entries(groups)
.map(
([eventTicker, markets]) => ({

eventTicker,

markets

})
);

}


/* ================================
NFL GAME NAME
================================ */

function getGameName(group) {

const teams = [];


for (const market of group.markets) {

const team =
getTeamName(market);


if (
team &&
!teams.includes(team)
) {

teams.push(team);

}

}


/*
If two actual team names are
available, use them.
*/

if (teams.length >= 2) {

return (
teams[0] +
" vs. " +
teams[1]
);

}


/*
Some Kalshi responses put the
matchup directly in title.
*/

for (const market of group.markets) {

const title =
String(
market.title || ""
);


const match =
title.match(
/(.+?)\s+(?:vs\.?|at|@)\s+(.+)/i
);


if (match) {

return (
cleanTeamName(
match[1]
) +
" vs. " +
cleanTeamName(
match[2]
)
);

}

}


/*
Last-resort fallback.
*/

return (
group.eventTicker ||
"NFL Game"
);

}


/* ================================
NFL RENDER
================================ */

function renderNFL() {

const list =
document.getElementById(
"nflList"
);


if (!nflMarkets.length) {

list.innerHTML =
`<div class="empty">
No open NFL markets found.
</div>`;

return;

}


const games =
groupNFLMarkets();


list.innerHTML =
games.map(
group => {

const gameName =
getGameName(group);


const dates =
group.markets
.map(
market =>
settlementInfo(market)
)
.filter(
x =>
x.ms !== Infinity
)
.sort(
(a,b) =>
a.ms - b.ms
);


const settlement =
dates[0] ||
{
countdown: "Unknown",
date: "Settlement unavailable"
};


/*
Deduplicate team markets.
*/

const seen = new Set();


const marketRows =
group.markets
.map(
market => {

const team =
getTeamName(market);


const identifier =
team ||
market.ticker;


if (
seen.has(identifier)
) {
return "";
}


seen.add(identifier);


return `

<div class="nfl-market">

<div>

<div class="team-name">

${escapeHtml(
team ||
market.title ||
market.ticker
)}

</div>

<div class="subtitle">

${escapeHtml(
market.ticker
)}

</div>

</div>


<button
class="price"
onclick='openBuy(${JSON.stringify(
market
)}, "yes")'
>

YES

${
yesAsk(market)
? yesAsk(market)
.toFixed(0) + "¢"
: "—"
}

</button>


<button
class="price"
onclick='openBuy(${JSON.stringify(
market
)}, "no")'
>

NO

${
noAsk(market)
? noAsk(market)
.toFixed(0) + "¢"
: "—"
}

</button>

</div>

`;

}
)
.join("");


return `

<div class="nfl-game">

<div class="nfl-game-title">

${escapeHtml(
gameName
)}

</div>


<div class="nfl-game-meta">

Expected settlement:
${escapeHtml(
settlement.countdown
)}

·

${escapeHtml(
settlement.date
)}

</div>


${marketRows}

</div>

`;

}
).join("");

}


/* ================================
BUY MODAL
================================ */

function openBuy(
market,
side
) {

selectedMarket =
market;


document.getElementById(
"modalMarket"
).textContent =
market.title ||
market.subtitle ||
market.ticker;


document.getElementById(
"orderSide"
).value =
side;


const price =
side === "yes"
? yesAsk(market)
: noAsk(market);


document.getElementById(
"orderPrice"
).value =
price
? Math.round(price)
: 50;


document.getElementById(
"orderCount"
).value =
1;


updateCost();


document.getElementById(
"orderError"
).textContent =
"";


document.getElementById(
"orderError"
).style.color =
"#ff7777";


document.getElementById(
"modalBackdrop"
).style.display =
"flex";

}


function closeModal() {

document.getElementById(
"modalBackdrop"
).style.display =
"none";

selectedMarket =
null;

}


function updateCost() {

const price =
num(
document.getElementById(
"orderPrice"
).value
);


const count =
num(
document.getElementById(
"orderCount"
).value
);


document.getElementById(
"maxCost"
).textContent =
money(
(price * count) / 100
);

}


/* ================================
BUY
================================ */

async function confirmBuy() {

if (!selectedMarket)
return;


const side =
document.getElementById(
"orderSide"
).value;


const price =
num(
document.getElementById(
"orderPrice"
).value
);


const count =
num(
document.getElementById(
"orderCount"
).value
);


const errorBox =
document.getElementById(
"orderError"
);


if (
price < 1 ||
price > 99
) {

errorBox.textContent =
"Price must be 1-99 cents.";

return;

}


if (
!Number.isInteger(count) ||
count < 1
) {

errorBox.textContent =
"Contracts must be at least 1.";

return;

}


const cost =
price * count / 100;


const confirmed =
confirm(
`BUY ${count} ${side.toUpperCase()} contract(s) at ${price}¢ each?\n\nMaximum cost: ${money(cost)}`
);


if (!confirmed)
return;


try {

errorBox.textContent =
"Submitting order...";


const response =
await fetch(
WORKER_URL +
"/api/order",
{
method: "POST",

headers: {
"Content-Type":
"application/json"
},

body: JSON.stringify({

ticker:
selectedMarket.ticker,

side,

price,

count

})

}
);


const data =
await response.json();


if (
!response.ok ||
!data.ok
) {

throw new Error(
JSON.stringify(
data.error ||
data.order ||
data
)
);

}


errorBox.style.color =
"#8cffb0";

errorBox.textContent =
"Order submitted successfully.";


setTimeout(
closeModal,
1200
);


loadPortfolio();


} catch (error) {

console.error(error);

errorBox.style.color =
"#ff7777";

errorBox.textContent =
"Order failed: " +
error.message;

}

}


/* ================================
EVENTS
================================ */

document.getElementById(
"sortSelect"
).addEventListener(
"change",
renderMarkets
);


document.getElementById(
"minVolume"
).addEventListener(
"input",
renderMarkets
);


document.getElementById(
"maxSpread"
).addEventListener(
"input",
renderMarkets
);


document.getElementById(
"orderPrice"
).addEventListener(
"input",
updateCost
);


document.getElementById(
"orderCount"
).addEventListener(
"input",
updateCost
);


document.getElementById(
"orderSide"
).addEventListener(
"change",
() => {

if (!selectedMarket)
return;


const side =
document.getElementById(
"orderSide"
).value;


const price =
side === "yes"
? yesAsk(selectedMarket)
: noAsk(selectedMarket);


if (price) {

document.getElementById(
"orderPrice"
).value =
Math.round(price);

updateCost();

}

}
);


/* ================================
START
================================ */

loadPortfolio();
loadMarkets();
loadNFL();


/* Portfolio */

setInterval(
loadPortfolio,
10000
);


/* Markets */

setInterval(
loadMarkets,
30000
);


/* NFL */

setInterval(
loadNFL,
30000
);


/* Update settlement countdowns */

setInterval(
() => {

if (allMarkets.length) {
renderMarkets();
}

if (nflMarkets.length) {
renderNFL();
}

},
30000
);

</script>
